<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sanes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/bootstrap.min.css">
<style>
/* Idea de diseño: banca privada de bolsillo. Cada san es una "cuenta"; arriba, una tarjeta
   azul marino con guilloché dorado como un billete, cifras en serif, movimientos como un extracto. */
:root{
  --fondo:#F2F4F8; --superficie:#FFFFFF; --hundido:#E8ECF3; --borde:#DADFE9; --tinta:#0D1828; --tenue:#5E6A7E;
  --marino:#0E2140; --marino-2:#1D3B66; --sobre-marino:#F3EFE4; --sobre-marino-tenue:#B9C3D6;
  --oro:#B08A3E; --oro-vivo:#D9B76E; --sobre-oro:#14223A; --azul:#1D3B66;
  --primario:#0E2140; --primario-tinta:#FFFFFF; --suave:#E6EBF4;
  --bien:#1B7350; --bien-suave:#DFF1E8; --alerta:#9A5F07; --alerta-suave:#FBEFD6; --peligro:#B0352A; --peligro-suave:#F8E2DF;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --cuerpo:"Manrope","Segoe UI",system-ui,sans-serif;
  --radio:16px; --sombra:0 1px 2px rgba(13,24,40,.05),0 10px 30px rgba(13,24,40,.07);
  --noche:#071226;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --fondo:#09101B; --superficie:#101A2A; --hundido:#0C1522; --borde:#223049; --tinta:#E7ECF4; --tenue:#8D9AB0;
    --marino:#132A4D; --marino-2:#22467A; --azul:#7FA2DA;
    --oro:#D4B06A; --oro-vivo:#E8CD8F; --primario:#D4B06A; --primario-tinta:#0B1320; --suave:#1A2740;
    --bien:#5FCB98; --bien-suave:#11301F; --alerta:#F0B44C; --alerta-suave:#33250C; --peligro:#F2877A; --peligro-suave:#3A1916;
    --sombra:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --fondo:#09101B; --superficie:#101A2A; --hundido:#0C1522; --borde:#223049; --tinta:#E7ECF4; --tenue:#8D9AB0;
  --marino:#132A4D; --marino-2:#22467A; --azul:#7FA2DA;
  --oro:#D4B06A; --oro-vivo:#E8CD8F; --primario:#D4B06A; --primario-tinta:#0B1320; --suave:#1A2740;
  --bien:#5FCB98; --bien-suave:#11301F; --alerta:#F0B44C; --alerta-suave:#33250C; --peligro:#F2877A; --peligro-suave:#3A1916;
  --sombra:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--fondo);color:var(--tinta);font-family:var(--cuerpo);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--fondo)}
h1,h2,h3{font-family:var(--display);margin:0;color:inherit;font-weight:600;line-height:1.15;text-wrap:balance}
h1{font-size:26px} h2{font-size:19px} h3{font-size:17px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul)}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.tenue{color:var(--tenue)} .num{font-variant-numeric:tabular-nums}
.rotulo{font-family:var(--cuerpo);font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue)}

/* Botones y campos (Bootstrap ajustado) */
.btn{font-weight:700;border-radius:12px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background-image:none}
.btn-sm{min-height:34px;border-radius:10px;font-size:13px;padding:4px 12px}
.btn-link{min-height:0;padding:0}
.btn-primary{--bs-btn-bg:var(--primario);--bs-btn-border-color:var(--primario);--bs-btn-color:var(--primario-tinta);
  --bs-btn-hover-bg:var(--primario);--bs-btn-hover-border-color:var(--primario);--bs-btn-hover-color:var(--primario-tinta);
  --bs-btn-active-bg:var(--primario);--bs-btn-active-border-color:var(--primario);--bs-btn-active-color:var(--primario-tinta);
  --bs-btn-disabled-bg:var(--primario);--bs-btn-disabled-border-color:var(--primario);--bs-btn-disabled-color:var(--primario-tinta)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-outline-secondary{--bs-btn-color:var(--tinta);--bs-btn-border-color:var(--borde);--bs-btn-hover-bg:var(--suave);
  --bs-btn-hover-color:var(--tinta);--bs-btn-hover-border-color:var(--borde);--bs-btn-active-bg:var(--suave);--bs-btn-active-color:var(--tinta);background:var(--superficie)}
.btn-outline-danger{--bs-btn-color:var(--peligro);--bs-btn-border-color:var(--peligro);--bs-btn-hover-bg:var(--peligro-suave);
  --bs-btn-hover-color:var(--peligro);--bs-btn-hover-border-color:var(--peligro);--bs-btn-active-bg:var(--peligro-suave);--bs-btn-active-color:var(--peligro)}
.btn-link{--bs-btn-color:var(--tenue);--bs-btn-hover-color:var(--peligro);text-decoration:none;font-weight:600}
.btn.btn-primary{background-color:var(--primario);border-color:var(--primario);color:var(--primario-tinta)}
.btn.btn-outline-secondary{color:var(--tinta);border-color:var(--borde);background-color:var(--superficie)}
.btn.btn-outline-secondary:hover{background-color:var(--suave);color:var(--tinta)}
.btn.btn-outline-danger{color:var(--peligro);border-color:var(--peligro);background-color:transparent}
.btn.btn-outline-danger:hover{background-color:var(--peligro-suave);color:var(--peligro)}
.btn.btn-link{color:var(--tenue);background:none;border-color:transparent}
.btn.btn-link:hover{color:var(--peligro)}
.btn-oro{background:linear-gradient(135deg,var(--oro-vivo),var(--oro));color:var(--sobre-oro);border:0}
.btn-oro:hover{color:var(--sobre-oro);filter:brightness(1.06)}
.form-control,.form-select{border-color:var(--borde);border-radius:10px;min-height:44px;background-color:var(--superficie);color:var(--tinta)}
.form-control:focus,.form-select:focus{border-color:var(--oro);box-shadow:0 0 0 .2rem var(--suave);background-color:var(--superficie);color:var(--tinta)}

/* Estructura de la app */
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--fondo)}
@media (min-width:560px){ body{background:var(--hundido)} .app{border-inline:1px solid var(--borde);box-shadow:var(--sombra)} }
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--fondo);border-bottom:1px solid var(--borde)}
.marca{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:600;font-size:19px}
.marca i{width:24px;height:24px;border-radius:50%;border:4px solid var(--azul);border-right-color:var(--oro);display:block}
.top .rol{margin-left:auto}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--oro);flex:none}
main{flex:1;padding:16px 16px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.cabecera{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.seccion{display:flex;flex-direction:column;gap:10px;min-width:0}
.seccion-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.aviso{background:var(--alerta-suave);color:var(--alerta);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.tabs{position:sticky;bottom:0;z-index:6;display:flex;background:var(--superficie);border-top:1px solid var(--borde);padding:4px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px 7px;text-decoration:none;color:var(--tenue);font-weight:700;font-size:12px;border-radius:12px}
.tabs a::before{content:"";width:22px;height:3px;border-radius:3px;background:transparent}
.tabs a.activo{color:var(--tinta)} .tabs a.activo::before{background:var(--oro)}
.tabs a .num{font-size:11px;opacity:.75}

/* Tarjeta tipo banco */
.saldo{position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 18px;color:var(--sobre-marino);
  background:radial-gradient(130% 150% at 100% 0%,var(--marino-2) 0%,var(--marino) 62%);box-shadow:var(--sombra);display:flex;flex-direction:column;gap:2px}
.saldo::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-radial-gradient(circle at 112% -18%,transparent 0 10px,rgba(217,183,110,.11) 10px 11px)}
.saldo::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-radial-gradient(circle at -20% 130%,transparent 0 13px,rgba(217,183,110,.07) 13px 14px)}
.saldo>*{position:relative;z-index:1}
.saldo-cab{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--sobre-marino-tenue);font-weight:800}
.chip-oro{width:32px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--oro-vivo),var(--oro));display:inline-block;flex:none;
  box-shadow:inset 0 0 0 1px rgba(20,34,58,.25)}
.saldo-cab .dcha{margin-left:auto;letter-spacing:.04em;text-transform:none;font-weight:700}
.saldo-monto{font-family:var(--display);font-size:38px;font-weight:600;line-height:1.1;margin-top:14px;overflow-wrap:anywhere}
.saldo-sub{color:var(--sobre-marino-tenue);font-size:13px}
.saldo-pie{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(217,183,110,.32)}
.saldo-pie span{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--sobre-marino-tenue);font-weight:700}
.saldo-pie b{font-size:14px;font-weight:700}
.saldo .acciones-saldo{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.saldo .btn-outline-light{border-color:rgba(243,239,228,.35);color:var(--sobre-marino);background:transparent}
.saldo .btn-outline-light:hover{background:rgba(243,239,228,.1);color:var(--sobre-marino)}

/* Listas tipo extracto */
.lista{list-style:none;margin:0;padding:0;background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);overflow:hidden}
.lista>li{padding:13px 14px;border-bottom:1px solid var(--borde)}
.lista>li:last-child{border-bottom:0}
.fila{display:flex;gap:12px;align-items:center;min-width:0}
.fila-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.fila-txt b{font-weight:700;overflow-wrap:anywhere}
.fila-txt span{font-size:12.5px;color:var(--tenue)}
.fila-monto{text-align:right;font-weight:800;white-space:nowrap}
.fila-monto small{display:block;font-weight:600;font-size:11.5px;color:var(--tenue)}
.fila-acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.mov-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:var(--suave);color:var(--azul)}
.mov-ic.entra{background:var(--bien-suave);color:var(--bien)} .mov-ic.sale{background:var(--alerta-suave);color:var(--alerta)}
.pos{color:var(--bien)} .neg{color:var(--tinta)}
.vacio-lista{padding:20px 16px;text-align:center;color:var(--tenue);font-size:14px}

/* Cuentas (sanes) */
.cuentas{display:flex;flex-direction:column;gap:12px}
.cuenta{display:grid;grid-template-columns:1fr auto;gap:12px;width:100%;text-align:left;background:var(--superficie);border:1px solid var(--borde);
  border-radius:var(--radio);padding:16px;box-shadow:var(--sombra);cursor:pointer;transition:border-color .15s,transform .15s}
.cuenta:hover{border-color:var(--oro);transform:translateY(-1px)}
.cuenta dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:10px 0 0;font-size:13.5px}
dt{color:var(--tenue);font-weight:500} dd{margin:0;font-weight:700}
.pildora{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--suave);color:var(--azul);white-space:nowrap}
.pildora.bien{background:var(--bien-suave);color:var(--bien)}
.pildora.alerta,.pildora.falta{background:var(--alerta-suave);color:var(--alerta)}
.pildora.peligro{background:var(--peligro-suave);color:var(--peligro)}
.pildoras{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dial text{font-family:var(--display);font-weight:600;fill:var(--tinta)}

/* Paneles */
.panel{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel .pie{justify-content:flex-start}
.cifras{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cifras div span{display:block;font-size:12px;color:var(--tenue)}
.cifras div b{font-family:var(--display);font-size:18px;font-weight:600}
.regla{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px}
.regla dt{color:var(--tenue)} .regla dd{text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--borde);background:var(--superficie);color:var(--tinta);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;min-height:36px}
.chip.activo{background:var(--primario);border-color:var(--primario);color:var(--primario-tinta)}
.chip.marca-r{position:relative}
.chip.marca-r::after{content:"";position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--oro)}
.entrega{border:1px dashed var(--oro);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--hundido)}
.entrega .fila-monto{font-family:var(--display);font-size:22px;font-weight:600}
.turno{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--marino);color:var(--sobre-marino);font-weight:800;font-size:13px;flex:none;border:1.5px solid var(--oro)}
.vacio{text-align:center;padding:30px 18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.vacio p{max-width:44ch;color:var(--tenue)}
.pie{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.error{color:var(--peligro);font-size:14px;font-weight:700}
.calculo{background:var(--suave);border-radius:12px;padding:10px 12px;font-size:14px}
.codigo{font-family:var(--display);font-size:17px;letter-spacing:.16em;background:var(--suave);padding:2px 10px;border-radius:8px}
.codigo-in{max-width:170px;text-transform:uppercase;letter-spacing:.2em;font-weight:800}
.unir{display:flex;gap:8px;flex-wrap:wrap}
.hallado{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:14px;border:1px solid var(--borde);border-radius:12px;background:var(--hundido)}
.hallado dl,.perfil dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:14px}
.ayuda{grid-column:1/-1;font-size:13px;color:var(--tenue);margin-top:-4px}
.ayuda.mal{color:var(--peligro);font-weight:700} .ayuda.bien{color:var(--bien);font-weight:700}
.buscar{width:100%}

/* Tablas que se apilan como tarjetas */
.tabla-caja{min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px;display:block}
thead{display:none} tbody{display:block}
tr{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--borde)}
tr:last-child{border-bottom:0}
td{padding:0;border:0}
td.acciones{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px}
.et{color:var(--tenue);font-size:12px;margin-right:6px}

/* Entrada */
.entrada{flex:1;display:flex;flex-direction:column;gap:22px;padding:28px 18px 32px}
.entrada h1{font-size:34px;line-height:1.05}
.entrada h1 em{font-style:italic;color:var(--oro)}
.entrada .lema{color:var(--tenue);max-width:46ch;margin-top:10px}
.acceso{display:flex;flex-direction:column;gap:12px}
.acceso .btn{width:100%}

/* Chat */
.chat-cab{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--superficie);border-bottom:2px solid var(--oro)}
.chat-cab div{display:flex;flex-direction:column;min-width:0} .chat-cab span{font-size:12px}
.chat-pautas{background:var(--suave);padding:10px 14px;font-size:13px}
.chat-msgs{flex:1;display:flex;flex-direction:column;gap:8px;padding:14px}
.msg{max-width:82%;align-self:flex-start;background:var(--superficie);border:1px solid var(--borde);border-radius:16px 16px 16px 4px;padding:8px 12px}
.msg b{font-size:12px;color:var(--oro)} .msg p{overflow-wrap:anywhere} .msg time{display:block;text-align:right;font-size:11px;color:var(--tenue)}
.msg.mio{align-self:flex-end;background:var(--marino);border-color:var(--marino);color:var(--sobre-marino);border-radius:16px 16px 4px 16px}
.msg.mio time{color:var(--sobre-marino-tenue)}
.chat-form{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--superficie);border-top:1px solid var(--borde)}
.chat-form input{flex:1;min-width:0}

/* Hojas que suben desde abajo */
.fondo{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:19}
dialog{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;z-index:20;padding:0;
  border:1px solid var(--borde);border-bottom:0;border-radius:24px 24px 0 0;background:var(--superficie);color:var(--tinta);animation:sube .22s ease-out}
dialog form{padding:22px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
dialog form::before{content:"";align-self:center;width:40px;height:4px;border-radius:4px;background:var(--borde);margin-top:-8px}
dialog .pie .btn{flex:1 1 auto}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.campos label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;min-width:0}
.campos label.ancho{grid-column:1/-1}
@media (max-width:400px){ .campos{grid-template-columns:1fr} }
.recibo{background:var(--hundido);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.recibo dt{color:var(--tenue)} .recibo dd{text-align:right}
.recibo .total{border-top:1px dashed var(--borde);padding-top:8px;font-weight:800}
@keyframes sube{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){ dialog{animation:none} .cuenta{transition:none} }
#tostada{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--tinta);color:var(--fondo);
  padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);text-align:center}
#tostada.ver{opacity:1}

/* Portada de entrada: siempre azul noche, como la app de un banco */
.login{flex:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  padding:48px 24px calc(32px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--sobre-marino);
  background:radial-gradient(120% 75% at 50% 0%,var(--marino-2) 0%,var(--marino) 55%,var(--noche) 100%)}
.login-cab{display:flex;flex-direction:column;align-items:center;gap:6px}
.login-marca{font-family:var(--display);font-size:28px;font-weight:600}
.login-saludo{color:var(--sobre-marino-tenue);font-size:15px}
.login-pie{color:var(--sobre-marino-tenue);font-size:12.5px;margin-top:6px}
.login-msg{min-height:20px;font-size:13.5px;font-weight:700;color:var(--sobre-marino-tenue)}
.login-msg.mal{color:#F2A094}

<script>
/* Sanes para Android: sustituto local de la base de datos.
   La app web usa claude.use("db") y claude.use("user") cuando se abre como página
   de Claude. Dentro del APK esas funciones no existen, así que aquí se ofrecen las
   mismas operaciones guardando todo en el almacenamiento del propio móvil. */
(function(){
  const CLAVE="sanes-apk-db-v2", CLAVE_UID="sanes-apk-uid";
  let docs={};
  try{ docs=JSON.parse(localStorage.getItem(CLAVE)||"{}")||{}; }catch(e){ docs={}; }
  const guardarTodo=()=>{ try{ localStorage.setItem(CLAVE,JSON.stringify(docs)); }
    catch(e){ const x=new Error("El móvil no tiene espacio para guardar más datos."); x.code="quota_exceeded"; throw x; } };
  const copia=x=>x==null?x:JSON.parse(JSON.stringify(x));
  const nuevoId=()=>{ const r=new Uint8Array(10); crypto.getRandomValues(r); return [...r].map(b=>b.toString(36).padStart(2,"0")).join("").slice(0,20); };
  let uid=null; try{ uid=localStorage.getItem(CLAVE_UID); }catch(e){}
  if(!uid){ uid="movil-"+nuevoId(); try{ localStorage.setItem(CLAVE_UID,uid); }catch(e){} }

  const padre=p=>p.split("/").slice(0,-1).join("/");
  const esObjeto=v=>v&&typeof v==="object"&&!Array.isArray(v);
  function mezclar(base,cambios){ const out=esObjeto(base)?{...base}:{};
    for(const [k,v] of Object.entries(cambios)) out[k]=esObjeto(v)&&esObjeto(out[k])?mezclar(out[k],v):copia(v);
    return out; }

  const oyentes=new Set();
  function avisar(ruta){ const col=padre(ruta); for(const o of [...oyentes]) if(o.col===col) setTimeout(()=>o.emitir(),0); }
  const foto=(id,data)=>({id,exists:data!==undefined,data:()=>copia(data),metadata:{fromCache:false,hasPendingWrites:false}});

  function refDoc(ruta){
    return { id:ruta.split("/").pop(), path:ruta,
      async get(){ return foto(this.id,docs[ruta]); },
      async set(data){ docs[ruta]=copia(data); guardarTodo(); avisar(ruta); },
      async update(data){ if(!(ruta in docs)){ const e=new Error("Ese dato ya no existe."); e.code="invalid_argument"; throw e; }
        docs[ruta]=mezclar(docs[ruta],data); guardarTodo(); avisar(ruta); },
      async delete(){ delete docs[ruta]; guardarTodo(); avisar(ruta); },
      collection(sub){ return refCol(ruta+"/"+sub); },
      onSnapshot(sig){ const o={col:padre(ruta),emitir:()=>sig(foto(this.id,docs[ruta]))}; oyentes.add(o); setTimeout(o.emitir,0); return ()=>oyentes.delete(o); } };
  }
  function refCol(ruta,orden=null,tope=0){
    const consultar=()=>{ let l=Object.keys(docs).filter(k=>padre(k)===ruta).map(k=>({id:k.split("/").pop(),d:docs[k]}));
      if(orden) l.sort((a,b)=>{ const x=a.d[orden.f], y=b.d[orden.f]; const c=x===y?0:x==null?1:y==null?-1:x<y?-1:1; return orden.dir==="desc"?-c:c; });
      else l.sort((a,b)=>a.id<b.id?-1:1);
      if(tope) l=l.slice(0,tope);
      const ds=l.map(x=>foto(x.id,x.d));
      return {docs:ds,size:ds.length,empty:!ds.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}; };
    return { path:ruta,
      doc(id){ return refDoc(ruta+"/"+(id||nuevoId())); },
      async add(data){ const r=refDoc(ruta+"/"+nuevoId()); await r.set(data); return r; },
      orderBy(f,dir){ return refCol(ruta,{f,dir:dir||"asc"},tope); },
      limit(n){ return refCol(ruta,orden,n); },
      where(){ return this; },
      async get(){ return consultar(); },
      onSnapshot(sig){ const o={col:ruta,emitir:()=>sig(consultar())}; oyentes.add(o); setTimeout(o.emitir,0); return ()=>oyentes.delete(o); } };
  }
  const db={ doc:refDoc, collection:p=>refCol(p) };
  const user={
    id:async()=>uid, isOwner:()=>true, canEdit:()=>true,
    can:async()=>true,
    me:async()=>({id:uid,name:"",avatarUrl:"",canEdit:true}),
    profiles:async ids=>Object.fromEntries((ids||[]).map(i=>[i,{id:i,name:""}])),
    search:async()=>[] };
  window.claude={ use:n=>Promise.resolve(n==="db"?db:n==="user"?user:null) };
})();
</script>
<script>
(function(){ const r=document.documentElement, mq=matchMedia("(prefers-color-scheme: dark)");
  const poner=()=>r.setAttribute("data-bs-theme", r.dataset.theme || (mq.matches?"dark":"light"));
  poner(); mq.addEventListener("change",poner);
  new MutationObserver(poner).observe(r,{attributes:true,attributeFilter:["data-theme"]}); })();

const TIPOS_DOC=["DNI","NIE","Cédula V","Cédula E","Pasaporte","ID europeo"];
const SEXOS=["Femenino","Masculino","Otro"];
const FRECUENCIAS=["Semanal","Quincenal","Mensual"];
const MONEDAS=["EUR","USD"];
const METODOS=["Efectivo","Transferencia","Bizum","Tarjeta"];

const S={ db:null, user:null, uid:null, nombre:"", avatar:"", rw:true, admin:false, listo:false, sinConexion:false, errorCarga:"",
  rol:null, vista:"inicio", sanId:null, ronda:null, comSan:null, chatSan:null, chatUnsub:null, mensajes:[],
  comFrec:"", comCuota:"", comQ:"", borrador:"", codigo:"", hallado:null, invit:null, msgCodigo:"",
  personas:[], sanes:[], filtro:"", confirmar:null, nombres:{},
  desbloqueado:false, bloqueo:null, cuenta:null, bloqueoListo:false, rolElegido:"organizador", intentos:0, esperaHasta:0, modoLogin:null, tras:null, cfg:null, dibujando:false, perfiles:{}, fotoNueva:undefined };
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dinero=(n,m)=>new Intl.NumberFormat("es-ES",{style:"currency",currency:m||"EUR"}).format(n||0);
const fecha=d=>(d instanceof Date?d:new Date(String(d).slice(0,10)+"T12:00:00")).toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"});
const nombreDe=p=>p?`${p.nombres} ${p.apellidos}`:"Persona eliminada";
const persona=id=>S.personas.find(p=>p.id===id);
const opciones=(lista,sel)=>lista.map(o=>`<option${o===sel?" selected":""}>${esc(o)}</option>`).join("");
const num=v=>{ const n=parseFloat(String(v??"").replace(",",".")); return isFinite(n)?n:NaN; };
const redondo=n=>Math.round((n||0)*100)/100;
const DIA=864e5;
const hoy=()=>{ const d=new Date(); d.setHours(12,0,0,0); return d; };
const isoLocal=d=>{ const z=new Date(d); return z.getFullYear()+"-"+String(z.getMonth()+1).padStart(2,"0")+"-"+String(z.getDate()).padStart(2,"0"); };
const diasEntre=(a,b)=>Math.round((b-a)/DIA);
const unidad=f=>f==="Mensual"?"mes":f==="Semanal"?"semana":"quincena";
const hora=iso=>new Date(iso).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});

function fechaTurno(s,t){ const d=new Date(s.inicio+"T12:00:00");
  if(s.frecuencia==="Mensual") d.setMonth(d.getMonth()+t-1); else d.setDate(d.getDate()+(t-1)*(s.frecuencia==="Semanal"?7:14)); return d; }
const finDe=s=>fechaTurno(s,s.puestos);
const uid=()=>S.uid;
const yo=()=>S.personas.find(p=>p.cuentaId&&p.cuentaId===uid());
const misSanes=()=>S.rol==="consulta"?S.sanes:S.sanes.filter(s=>s.dueno===uid());
const puedeGestionar=()=>S.rw&&S.rol==="organizador";
function misPersonas(){
  const ids=new Set();
  for(const s of misSanes()){
    for(const x of s.participantes||[]){ ids.add(x.personaId); if(x.avalistaId) ids.add(x.avalistaId); }
    for(const x of s.solicitudes||[]) ids.add(x.personaId);
  }
  return S.personas.filter(p=>p.dueno===uid()||ids.has(p.id));
}
const nombrePart=(s,x)=>{ const p=persona(x.personaId); return p?nombreDe(p):(x.nombre||"Participante"); };
const organiza=s=>s.dueno===uid()?"tú":(nombrePerfil(s.dueno)||"Organizador");
/* Perfil público de cada cuenta: nombre y foto que eligió en la app; si no, el de su cuenta de Claude */
const perfilDe=id=>(S.perfiles&&S.perfiles[id])||{};
const nombrePerfil=id=>perfilDe(id).nombre||(id===uid()?S.nombre:S.nombres[id])||"";
const miNombre=()=>nombrePerfil(uid());
const fotoDe=id=>perfilDe(id).foto||(id===uid()?S.avatar:"");
const iniciales=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(p=>p[0]||"").join("").toUpperCase()||"?";
function avatarHTML(id,tam=34,extra=""){
  const f=fotoDe(id), n=nombrePerfil(id);
  return f?`<img class="avatar ${extra}" src="${esc(f)}" alt="" style="width:${tam}px;height:${tam}px">`
    :`<span class="avatar avatar-ini ${extra}" style="width:${tam}px;height:${tam}px;font-size:${Math.round(tam*.38)}px" aria-hidden="true">${esc(iniciales(n))}</span>`;
}
const gmailURL=(para,asunto,cuerpo)=>`https://mail.google.com/mail/?view=cm&fs=1${para?`&to=${encodeURIComponent(para)}`:""}&su=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
const soyMiembro=s=>s.dueno===uid()||!!(yo()&&(s.participantes||[]).some(x=>x.personaId===yo().id));

/* Nombres de las cuentas de Claude: se guardan solo los ids y se resuelven al pintar */
const pendientesNombre=new Set();
function pedirNombres(ids){
  if(!S.user) return;
  const faltan=[...new Set(ids.filter(id=>id&&id!==uid()&&!(id in S.nombres)&&!pendientesNombre.has(id)))];
  if(!faltan.length) return;
  faltan.forEach(id=>pendientesNombre.add(id));
  S.user.profiles(faltan).then(ps=>{ for(const id of faltan){ S.nombres[id]=(ps[id]&&ps[id].name)||""; pendientesNombre.delete(id); } render(); })
    .catch(()=>{ for(const id of faltan){ S.nombres[id]=""; pendientesNombre.delete(id); } });
}
const nombreCuenta=id=>nombrePerfil(id)||(id===uid()?"Tú":"Participante");

/* ---------- Reglas de retraso, recargos y descuentos ---------- */
const REGLAS_BASE={diasGracia:3,multa:0,interesDiario:1,tope:30,descontar:true};
const reglas=s=>({...REGLAS_BASE,...(s.reglas||{})});
function recargoDe(s,dias,R){
  R=R||reglas(s); const fuera=dias-R.diasGracia; if(fuera<=0) return 0;
  let x=(R.multa||0)+s.cuota*(R.interesDiario||0)/100*fuera;
  if(R.tope>0) x=Math.min(x,s.cuota*R.tope/100+(R.multa||0));
  return redondo(x);
}
const claveCuota=(r,pid)=>r+"_"+pid;
function estadoCuota(s,r,pid){
  const k=claveCuota(r,pid), p=(s.pagos||{})[k], vence=fechaTurno(s,r);
  if(p) return {k,r,estado:"pagado",pago:p,vence,recargo:p.recargo||0,dias:0};
  const dias=diasEntre(vence,hoy());
  if(dias<0) return {k,r,estado:"futuro",vence,dias,recargo:0};
  if(dias<=reglas(s).diasGracia) return {k,r,estado:"gracia",vence,dias,recargo:0};
  return {k,r,estado:"atrasado",vence,dias,recargo:recargoDe(s,dias)};
}
function rondaActual(s){ let n=0; const h=hoy(); for(let r=1;r<=s.puestos;r++){ if(fechaTurno(s,r)<=h) n=r; } return n; }
function pendientesDe(s,pid){ const out=[]; for(let r=1;r<=rondaActual(s);r++){ const c=estadoCuota(s,r,pid); if(c.estado==="gracia"||c.estado==="atrasado") out.push(c); } return out; }
const deudaDe=(s,pid)=>redondo(pendientesDe(s,pid).reduce((t,c)=>t+s.cuota+c.recargo,0));
function cobroDe(s,x){
  const bote=redondo(s.cuota*s.puestos), R=reglas(s), ent=(s.entregas||{})["r"+x.turno]||null;
  const descuento=R.descontar?deudaDe(s,x.personaId):0;
  return {bote,descuento,neto:redondo(Math.max(0,bote-descuento)),entrega:ent,fecha:fechaTurno(s,x.turno)};
}
function atrasos(sanes){ const out=[];
  for(const s of sanes) for(const x of s.participantes||[]) for(const c of pendientesDe(s,x.personaId)) out.push({s,x,c});
  return out.sort((a,b)=>b.c.dias-a.c.dias); }
function sumar(lista){ const m={}; for(const [monto,mon] of lista){ m[mon]=redondo((m[mon]||0)+monto); } return m; }
const verSumas=m=>{ const ks=Object.keys(m).filter(k=>m[k]); return ks.length?ks.map(k=>dinero(m[k],k)).join(" · "):dinero(0,"EUR"); };
function movimientos(sanes){ const out=[];
  for(const s of sanes){
    for(const p of Object.values(s.pagos||{})){ if(!p) continue; const desc=p.metodo==="Descontado del cobro";
      out.push({fecha:p.fecha,titulo:p.nombre||"Participante",detalle:`${s.nombre} · cuota ronda ${p.ronda}${p.recargo?` · recargo ${dinero(p.recargo,s.moneda)}`:""}${desc?" · descontada del cobro":` · ${(p.metodo||"").toLowerCase()}`}`,
        monto:redondo((p.monto||0)+(p.recargo||0)),mon:s.moneda,signo:desc?0:1}); }
    for(const [k,e] of Object.entries(s.entregas||{})){ if(!e) continue;
      out.push({fecha:e.fecha,titulo:e.nombre||"Entrega",detalle:`${s.nombre} · entrega del bote, ronda ${k.slice(1)}${e.descuento?` · descontado ${dinero(e.descuento,s.moneda)}`:""}`,monto:e.monto,mon:s.moneda,signo:-1}); }
  }
  return out.sort((a,b)=>String(b.fecha||"").localeCompare(String(a.fecha||""))); }
const filaMov=m=>`<li><div class="fila"><span class="mov-ic ${m.signo<0?"sale":m.signo>0?"entra":""}" aria-hidden="true">${m.signo<0?"↑":m.signo>0?"↓":"⇄"}</span>
  <div class="fila-txt"><b>${esc(m.titulo)}</b><span>${esc(m.detalle)}</span></div>
  <div class="fila-monto num ${m.signo>0?"pos":"neg"}">${m.signo<0?"−":m.signo>0?"+":""}${dinero(m.monto,m.mon)}<small>${m.fecha?fecha(m.fecha):""}</small></div></div></li>`;
function pildoraCuota(c){
  return c.estado==="pagado"?`<span class="pildora bien">${c.pago.metodo==="Descontado del cobro"?"Descontado del cobro":"Pagado "+fecha(c.pago.fecha)}</span>`
    :c.estado==="futuro"?`<span class="pildora">Vence ${fecha(c.vence)}</span>`
    :c.estado==="gracia"?`<span class="pildora alerta">${c.dias===0?"Vence hoy":`${c.dias} ${c.dias===1?"día":"días"} · en gracia`}</span>`
    :`<span class="pildora peligro">${c.dias} días de retraso</span>`;
}
function textoReglas(s,R){
  R=R||reglas(s); const diario=redondo(s.cuota*R.interesDiario/100);
  const partes=[];
  if(R.multa>0) partes.push(`una multa de ${dinero(R.multa,s.moneda)}`);
  if(R.interesDiario>0) partes.push(`un interés del ${R.interesDiario}% de la cuota por día (${dinero(diario,s.moneda)} al día)`);
  const tras=partes.length?`Pasados ${R.diasGracia} ${R.diasGracia===1?"día":"días"} de gracia se cobra ${partes.join(" más ")}${R.tope>0&&R.interesDiario>0?`, con un interés máximo del ${R.tope}% de la cuota (${dinero(s.cuota*R.tope/100,s.moneda)})`:""}.`
    :`No se cobran recargos por retraso.`;
  return tras+(R.descontar?" Lo que no se pague se descuenta del cobro de esa persona cuando le toque.":"");
}

/* ---------- Documentos ---------- */
const LETRAS_DNI="TRWAGMYFPDXBNJZSQVHLCKE";
const AYUDA_DOC={
  "DNI":"8 números y una letra. Ejemplo: 12345678Z",
  "NIE":"Una letra X, Y o Z, 7 números y una letra. Ejemplo: X1234567L",
  "Cédula V":"Solo los números de la cédula, entre 6 y 8 cifras. Ejemplo: 12.345.678",
  "Cédula E":"Solo los números de la cédula de extranjero, entre 6 y 8 cifras. Ejemplo: 84.123.456",
  "Pasaporte":"Entre 6 y 12 letras y números, sin espacios. Ejemplo: PAB123456",
  "ID europeo":"El número de tu documento nacional, entre 5 y 15 letras y números."};
function validarDocumento(tipo,bruto){
  let n=String(bruto||"").toUpperCase().replace(/[\s.\-_/]/g,"");
  const mal=error=>({error});
  if(tipo==="DNI"){
    if(!/^\d{8}[A-Z]$/.test(n)) return mal(/^[XYZ]\d{7}[A-Z]$/.test(n)?"Ese número tiene forma de NIE. Cambia el tipo de documento a NIE.":"El DNI son 8 números seguidos de una letra, como 12345678Z.");
    if(LETRAS_DNI[parseInt(n.slice(0,8),10)%23]!==n[8]) return mal("La letra del DNI no corresponde a esos números. Revisa que no haya una cifra equivocada.");
  } else if(tipo==="NIE"){
    if(!/^[XYZ]\d{7}[A-Z]$/.test(n)) return mal("El NIE empieza por X, Y o Z, sigue con 7 números y termina en una letra, como X1234567L.");
    if(LETRAS_DNI[parseInt("XYZ".indexOf(n[0])+n.slice(1,8),10)%23]!==n[8]) return mal("La letra final del NIE no corresponde a esos números. Revisa que no haya una cifra equivocada.");
  } else if(tipo==="Cédula V"||tipo==="Cédula E"){
    n=n.replace(/^[VE]/,"");
    if(!/^\d+$/.test(n)) return mal("La cédula solo lleva números. Escríbela sin letras, como 12.345.678.");
    if(n.length<6||n.length>8||n[0]==="0") return mal("La cédula venezolana tiene entre 6 y 8 cifras y no empieza por cero.");
  } else if(tipo==="Pasaporte"){
    if(!/^[A-Z0-9]{6,12}$/.test(n)||!/\d/.test(n)) return mal("El pasaporte tiene entre 6 y 12 letras y números, sin símbolos, como PAB123456.");
  } else {
    if(!/^[A-Z0-9]{5,15}$/.test(n)) return mal("El documento debe tener entre 5 y 15 letras y números, sin símbolos.");
  }
  return {valor:n};
}
const verDoc=p=>(p.tipoDoc==="Cédula V"||p.tipoDoc==="Cédula E")
  ?p.tipoDoc.slice(-1)+"-"+String(p.numDoc).replace(/\B(?=(\d{3})+(?!\d))/g,"."):p.tipoDoc+" "+p.numDoc;
function ayudaDoc(){
  const f=dlg.querySelector("form[data-f=persona]"), e=$("#doc-ayuda"); if(!f||!e) return;
  const r=f.numDoc.value.trim()?validarDocumento(f.tipoDoc.value,f.numDoc.value):null;
  e.textContent=!r?AYUDA_DOC[f.tipoDoc.value]:r.error?r.error:"✓ El formato del documento es correcto.";
  e.className="ayuda"+(r?(r.error?" mal":" bien"):"");
}

  const usados=new Set(S.sanes.flatMap(s=>[s.codigo,...(s.invitaciones||[]).map(i=>i.codigo)])); let c;
  do{ const r=new Uint32Array(6); crypto.getRandomValues(r); c=Array.from(r,n=>abc[n%abc.length]).join(""); }while(usados.has(c)); return c; }

/* ---------- La rueda: un punto por puesto ---------- */
function dial(puestos,llenos,tam=72){
  const c=tam/2, R=c-8, r=Math.max(2.2,Math.min(6,(2*Math.PI*R)/(puestos*2.7)));
  let pts="";
  for(let i=0;i<puestos;i++){
    const a=-Math.PI/2+i*2*Math.PI/puestos, x=c+R*Math.cos(a), y=c+R*Math.sin(a);
    pts+=i<llenos?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${i===0?"var(--oro)":"var(--azul)"}"/>`
                 :`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r-0.8}" fill="none" stroke="var(--borde)" stroke-width="1.6"/>`;
  }
  return `<svg class="dial" width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}" role="img" aria-label="${llenos} de ${puestos} puestos ocupados">${pts}<text x="${c}" y="${c+5}" text-anchor="middle" font-size="${tam/5}">${llenos}/${puestos}</text></svg>`;
}

const use=n=>(window.claude&&typeof window.claude.use==="function")?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
function msgError(e){ const c=e&&e.code;
  return c==="invalid_argument"?"No tienes permiso para cambiar estos datos. "
    :c==="quota_exceeded"?"Se llenó el espacio de datos de la app. Borra sanes o personas que ya no uses."
    :c==="unavailable"||c==="resource_exhausted"?"No hay conexión ahora mismo. Inténtalo de nuevo en un momento."
    :c==="revoked"||c==="not_granted"?"Ya no tienes acceso a los datos de esta app."
    :(e&&e.message)||"Error desconocido."; }
async function escribir(fn){ if(!S.db) throw new Error("No hay conexión con la base de datos.");
  try{ return await fn(S.db); }catch(e){ if(e&&e.code==="invalid_argument") { S.rw=false; } throw new Error(msgError(e)); } }
const actualizarSan=(id,data)=>escribir(db=>db.doc("sanes/"+id).update(data));
const guardar=(col,id,data)=>escribir(async db=>{ const ref=id?db.doc(col+"/"+id):db.collection(col).doc(); await ref.set(data); return ref.id; });
const borrar=(col,id)=>escribir(db=>db.doc(col+"/"+id).delete());

async function iniciar(){
  ruta(); render();
  const [db,user]=await Promise.all([use("db"),use("user")]);
  S.db=db; S.user=user;
  if(user){ try{ const me=await user.me(); S.uid=me.id; S.nombre=me.name||""; S.avatar=me.avatarUrl||""; S.admin=!!me.canEdit;
    const cw=await user.can("data.write"); S.rw=cw!==false; }catch(e){} }
  if(!db||!S.uid){ S.errorCarga="sin-cuenta"; render(); return; }
  try{ const r=localStorage.getItem("sanes-rol"); if(["organizador","participante"].includes(r)) S.rolElegido=r; }catch(e){}
  try{ const d=await refAjustes().get(), x=d.exists?d.data():{};
    S.bloqueo=x.bloqueo&&x.bloqueo.hash?x.bloqueo:null; S.cuenta=x.cuenta&&x.cuenta.hash?x.cuenta:null; }catch(e){ S.bloqueo=null; S.cuenta=null; }
  S.bloqueoListo=true;
  const listos={s:false,p:false}, firmes={s:false,p:false};
  const timer=setTimeout(()=>{ S.sinConexion=true; if(listos.s) S.listo=true; render(); },10000);
  const ver=(k,sn)=>{ listos[k]=true; if(!sn.metadata.fromCache) firmes[k]=true;
    if(firmes.s&&firmes.p){ clearTimeout(timer); S.sinConexion=false; }
    S.listo=S.listo||(listos.s&&listos.p); render(); };
  db.collection("sanes").onSnapshot(sn=>{ S.sanes=sn.docs.map(d=>({id:d.id,...d.data()})); ver("s",sn); },
    e=>{ clearTimeout(timer); S.errorCarga=msgError(e); render(); });
  db.collection("perfiles").onSnapshot(sn=>{ const m={}; sn.docs.forEach(d=>{ m[d.id]=d.data(); }); S.perfiles=m; render(); }, ()=>{});
  db.collection("personas").onSnapshot(sn=>{ S.personas=sn.docs.map(d=>({id:d.id,...d.data()})); ver("p",sn); },
    ()=>{ listos.p=true; firmes.p=true; S.listo=S.listo||listos.s; render(); });
}

    ()=>tostada("No se pudo cargar el chat. Vuelve a abrirlo en un momento.")); }catch(e){ tostada("No se pudo abrir el chat."); }

let renderPendiente=false;
function render(){
  if(S.dibujando){ renderPendiente=true; return; }
  const ae=document.activeElement, fid=ae&&ae.id&&$("#app").contains(ae)?ae.id:null;
  let sel=null; try{ if(fid&&ae.selectionStart!=null) sel=[ae.selectionStart,ae.selectionEnd]; }catch(e){}
  let html;
  if(S.errorCarga) html=vistaError();
  else if(!S.listo||!S.bloqueoListo) html=vistaCargando();
  else if(!S.desbloqueado) html=vistaLogin();
  else if(S.chatSan) html=vistaChat();
  else html=vistaMarco();
  if(html===render.ultimo){ pedirNombres([...S.sanes.map(s=>s.dueno),...S.mensajes.map(m=>m.autor)]); return; }
  render.ultimo=html;
  $("#app").innerHTML=html;
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus(); if(sel) try{ el.setSelectionRange(sel[0],sel[1]); }catch(e){} } }
  pedirNombres([...S.sanes.map(s=>s.dueno),...S.mensajes.map(m=>m.autor)]);
}

function tarjetaSaldo({etiqueta,dcha="",monto,sub,pie=[],acciones=""}){
  return `<section class="saldo"><div class="saldo-cab"><span class="chip-oro" aria-hidden="true"></span>${esc(etiqueta)}${dcha?`<span class="dcha">${esc(dcha)}</span>`:""}</div>
    <p class="saldo-monto num">${monto}</p><p class="saldo-sub">${sub}</p>
    ${pie.length?`<div class="saldo-pie">${pie.map(([a,b])=>`<div><span>${a}</span><b class="num">${b}</b></div>`).join("")}</div>`:""}
    ${acciones?`<div class="acciones-saldo">${acciones}</div>`:""}</section>`;
}

function vistaInicio(){
  const ss=misSanes(), gest=puedeGestionar();
  if(!ss.length) return `<div class="panel vacio">${dial(6,0,96)}<h2>${S.rol==="consulta"?"Todavía no hay sanes":"Aún no tienes sanes"}</h2>
    <p>${S.rol==="consulta"?"Cuando el organizador cree un san aparecerá aquí con sus cuentas.":"Crea el primero: ponle nombre, define la cuota y cuántos puestos tiene. Después agregas a las personas y empiezas a anotar los pagos."}</p>
    ${gest?`<button class="btn btn-primary" data-a="nuevo-san">Crear mi primer san</button>`:""}</div>`;
  const atr=atrasos(ss), deuda=sumar(atr.map(a=>[a.s.cuota+a.c.recargo,a.s.moneda]));
  const nAtr=atr.filter(a=>a.c.estado==="atrasado").length, nGr=atr.length-nAtr;
  const mes=isoLocal(hoy()).slice(0,7);
  const rec=sumar(ss.flatMap(s=>Object.values(s.pagos||{}).filter(p=>p&&String(p.fecha||"").startsWith(mes)&&p.metodo!=="Descontado del cobro").map(p=>[(p.monto||0)+(p.recargo||0),s.moneda])));
  const prox=ss.flatMap(s=>(s.participantes||[]).map(x=>({s,x,f:fechaTurno(s,x.turno)}))).filter(o=>!(o.s.entregas||{})["r"+o.x.turno]).sort((a,b)=>a.f-b.f)[0];
  const card=tarjetaSaldo({etiqueta:"Pendiente por cobrar",dcha:`${ss.length} ${ss.length===1?"san":"sanes"}`,monto:verSumas(deuda),
    sub:atr.length?`${nAtr} ${nAtr===1?"cuota con retraso":"cuotas con retraso"} · ${nGr} en plazo de gracia`:"Todo el mundo está al día con sus cuotas.",
    pie:[["Cobrado este mes",verSumas(rec)],["Próxima entrega",prox?`${esc(nombrePart(prox.s,prox.x).split(" ")[0])} · ${fecha(prox.f)}`:"—"]],
    acciones:gest?`<button class="btn btn-sm btn-oro" data-a="nuevo-san">+ Nuevo san</button><button class="btn btn-sm btn-outline-light" data-a="tab" data-id="sanes">Ver mis sanes</button>`:""});
  const listaAtr=atr.slice(0,10).map(({s,x,c})=>`<li><div class="fila"><span class="turno">${x.turno}</span>
      <div class="fila-txt"><b>${esc(nombrePart(s,x))}</b><span>${esc(s.nombre)} · ronda ${c.r} · venció ${fecha(c.vence)}</span><div class="pildoras">${pildoraCuota(c)}${(s.avisos||{})[c.k]?`<span class="pildora">Avisado ${fecha(s.avisos[c.k])}</span>`:""}</div></div>
      <div class="fila-monto num">${dinero(s.cuota+c.recargo,s.moneda)}${c.recargo?`<small>incluye ${dinero(c.recargo,s.moneda)} de recargo</small>`:""}</div></div>
      ${gest?`<div class="fila-acc"><button class="btn btn-sm btn-primary" data-a="cobrar" data-s="${esc(s.id)}" data-r="${c.r}" data-p="${esc(x.personaId)}">Registrar pago</button>
        <button class="btn btn-sm btn-outline-secondary" data-a="avisar" data-s="${esc(s.id)}" data-r="${c.r}" data-p="${esc(x.personaId)}">Enviar aviso</button></div>`:""}</li>`).join("");
  const movs=movimientos(ss).slice(0,12);
  return `${card}
    <section class="seccion"><div class="seccion-cab"><h2>Por cobrar</h2><span class="rotulo">${atr.length} pendientes</span></div>
      <ul class="lista">${listaAtr||`<li class="vacio-lista">No hay cuotas vencidas sin pagar.</li>`}</ul></section>
    <section class="seccion"><div class="seccion-cab"><h2>Movimientos</h2><span class="rotulo">Últimos</span></div>
      <ul class="lista">${movs.map(filaMov).join("")||`<li class="vacio-lista">Aún no hay pagos registrados. Cuando anotes una cuota o entregues un bote aparecerá aquí.</li>`}</ul></section>`;
}

function vistaSanes(){
  const ss=misSanes().slice().sort((a,b)=>String(b.creado||"").localeCompare(String(a.creado||"")));
  const tarjetas=ss.map(s=>{ const n=(s.participantes||[]).length, ra=rondaActual(s);
    const deuda=redondo((s.participantes||[]).reduce((t,x)=>t+deudaDe(s,x.personaId),0));
    return `<button class="cuenta" data-a="abrir-san" data-id="${esc(s.id)}"><div><h3>${esc(s.nombre)}</h3>
      <div class="pildoras"><span class="pildora ${n<s.puestos?"falta":"bien"}">${n<s.puestos?`Faltan ${s.puestos-n}`:"Completo"}</span>${deuda>0?`<span class="pildora peligro">Pendiente ${dinero(deuda,s.moneda)}</span>`:""}</div>
      <dl><dt>Cuota</dt><dd class="num">${dinero(s.cuota,s.moneda)} · ${esc(s.frecuencia.toLowerCase())}</dd>
        <dt>Bote</dt><dd class="num">${dinero(s.cuota*s.puestos,s.moneda)}</dd>
        <dt>Ronda</dt><dd>${ra?`${ra} de ${s.puestos}`:`Empieza el ${fecha(s.inicio)}`}</dd></dl></div>${dial(s.puestos,n)}</button>`; }).join("");
  return `<div class="cabecera"><div><h1>${S.rol==="consulta"?"Sanes":"Mis sanes"}</h1><p class="tenue">Cada punto de la rueda es un puesto; el dorado cobra primero.</p></div>
      ${puedeGestionar()?`<button class="btn btn-primary" data-a="nuevo-san">+ Nuevo san</button>`:""}</div>
    ${ss.length?`<div class="cuentas">${tarjetas}</div>`:`<div class="panel vacio"><p>No hay sanes todavía.</p></div>`}`;
}

function vistaSan(){
  const s=S.sanes.find(x=>x.id===S.sanId), ps=(s.participantes||[]).slice().sort((a,b)=>a.turno-b.turno), R=reglas(s), gest=puedeGestionar();
  const ra=rondaActual(s), r=S.ronda&&S.ronda<=s.puestos?S.ronda:Math.max(1,ra);
  const deudaTotal=redondo(ps.reduce((t,x)=>t+deudaDe(s,x.personaId),0));
  const card=tarjetaSaldo({etiqueta:s.nombre,dcha:s.publico?"Público":"Privado",monto:dinero(s.cuota*s.puestos,s.moneda),
    sub:`Bote de cada ${unidad(s.frecuencia)} · ${dinero(s.cuota,s.moneda)} × ${s.puestos} puestos · organiza ${esc(organiza(s))}`,
    pie:[["Ronda",ra?`${ra} de ${s.puestos}`:"Sin empezar"],["Pendiente",dinero(deudaTotal,s.moneda)],["Empieza",fecha(s.inicio)],["Último turno",fecha(finDe(s))]]});
  const chips=Array.from({length:s.puestos},(_,i)=>i+1).map(i=>`<button class="chip ${i===r?"activo":""} ${i===ra?"marca-r":""}" data-a="ronda" data-id="${i}" aria-pressed="${i===r}">Ronda ${i}</button>`).join("");
  const xr=ps.find(x=>x.turno===r);
  let entrega;
  if(!xr) entrega=`<div class="entrega"><span class="rotulo">Entrega del bote</span><p class="tenue">Este turno aún no tiene a nadie asignado.</p></div>`;
  else { const cb=cobroDe(s,xr), vencido=cb.fecha<=hoy();
    entrega=`<div class="entrega"><span class="rotulo">Entrega del bote · ${fecha(cb.fecha)}</span>
      <div class="fila"><span class="turno">${xr.turno}</span><div class="fila-txt"><b>${esc(nombrePart(s,xr))}</b>
        <span>${cb.entrega?`Entregado el ${fecha(cb.entrega.fecha)}${cb.entrega.descuento?` · se descontaron ${dinero(cb.entrega.descuento,s.moneda)}`:""}`
          :cb.descuento>0?`Se le descontarán ${dinero(cb.descuento,s.moneda)} por cuotas sin pagar`:"Al día con sus cuotas"}</span></div>
        <div class="fila-monto num">${dinero(cb.entrega?cb.entrega.monto:cb.neto,s.moneda)}${!cb.entrega&&cb.descuento>0?`<small>de ${dinero(cb.bote,s.moneda)}</small>`:""}</div></div>
      ${gest?`<div class="fila-acc">${cb.entrega?`<button class="btn btn-sm btn-link" data-a="deshacer-entrega" data-r="${r}">Deshacer entrega</button>`
        :`<button class="btn btn-sm ${vencido?"btn-primary":"btn-outline-secondary"}" data-a="entregar" data-r="${r}">${vencido?"Registrar entrega":"Entregar por adelantado"}</button>`}</div>`:""}</div>`; }
  const cuotas=ps.map(x=>{ const c=estadoCuota(s,r,x.personaId), av=(s.avisos||{})[c.k];
    const debe=c.estado!=="pagado";
    return `<li><div class="fila"><span class="turno">${x.turno}</span><div class="fila-txt"><b>${esc(nombrePart(s,x))}</b>
        <div class="pildoras">${pildoraCuota(c)}${av&&debe?`<span class="pildora">Avisado ${fecha(av)}</span>`:""}</div></div>
      <div class="fila-monto num">${dinero(c.estado==="pagado"?(c.pago.monto||0)+(c.pago.recargo||0):s.cuota+c.recargo,s.moneda)}${c.recargo?`<small>recargo ${dinero(c.recargo,s.moneda)}</small>`:""}</div></div>
      ${gest?`<div class="fila-acc">${debe?`<button class="btn btn-sm btn-primary" data-a="cobrar" data-s="${esc(s.id)}" data-r="${r}" data-p="${esc(x.personaId)}">Registrar pago</button>
        ${c.estado==="gracia"||c.estado==="atrasado"?`<button class="btn btn-sm btn-outline-secondary" data-a="avisar" data-s="${esc(s.id)}" data-r="${r}" data-p="${esc(x.personaId)}">Enviar aviso</button>`:""}`
        :`<button class="btn btn-sm btn-link" data-a="deshacer-pago" data-r="${r}" data-p="${esc(x.personaId)}">Deshacer pago</button>`}</div>`:""}</li>`; }).join("");
  const pagadosR=ps.filter(x=>estadoCuota(s,r,x.personaId).estado==="pagado");
  const recR=redondo(pagadosR.reduce((t,x)=>{ const p=s.pagos[claveCuota(r,x.personaId)]; return t+(p.monto||0)+(p.recargo||0); },0));
  const reglasP=`<div class="panel"><div class="seccion-cab"><h2>Reglas de retraso</h2>${gest?`<button class="btn btn-sm btn-outline-secondary" data-a="editar-reglas">Editar</button>`:""}</div>
    <dl class="regla"><dt>Días de gracia</dt><dd>${R.diasGracia}</dd><dt>Multa al pasar la gracia</dt><dd class="num">${dinero(R.multa,s.moneda)}</dd>
      <dt>Interés por día</dt><dd class="num">${R.interesDiario}% · ${dinero(s.cuota*R.interesDiario/100,s.moneda)}</dd>
      <dt>Interés máximo</dt><dd>${R.tope>0?`${R.tope}% de la cuota`:"Sin límite"}</dd><dt>Descontar del cobro</dt><dd>${R.descontar?"Sí":"No"}</dd></dl>
    <p class="calculo">${esc(textoReglas(s,R))} Ejemplo: con 10 días de retraso el recargo sería ${dinero(recargoDe(s,10,R),s.moneda)}.</p></div>`;
  const filas=ps.map(x=>{ const p=persona(x.personaId), av=x.avalistaId?persona(x.avalistaId):null, cb=cobroDe(s,x);
    return `<tr><td><span class="turno">${x.turno}</span></td><td><b>${esc(nombrePart(s,x))}</b><br><span class="tenue">${p?esc(verDoc(p)+" · paga con "+pago(p).toLowerCase()):""}</span></td>
      <td><span class="et">Cobra el</span>${fecha(cb.fecha)}</td><td><span class="et">Recibe</span><b class="num">${dinero(cb.entrega?cb.entrega.monto:cb.neto,s.moneda)}</b></td>
      <td><span class="et">Avala</span>${x.avalistaId?esc(av?nombreDe(av):"—"):`<span class="pildora falta">Sin aval</span>`}</td>
      ${gest?`<td class="acciones"><button class="btn btn-sm btn-link" data-a="quitar-part" data-id="${esc(x.personaId)}">Quitar del san</button></td>`:""}</tr>`; }).join("");
  const pend=(s.solicitudes||[]).filter(x=>x.estado==="Pendiente"&&persona(x.personaId));
  const sol=gest&&pend.length?`<div class="panel"><div class="seccion-cab"><h2>Solicitudes</h2><span class="pildora falta">${pend.length} por responder</span></div>
    <div class="tabla-caja"><table><tbody>${pend.map(x=>{ const p=persona(x.personaId);
      return `<tr><td><b>${esc(nombreDe(p))}</b><br><span class="tenue">${fecha(x.fecha)}</span></td><td class="num">${esc(verDoc(p))}<br>${pildoraVerif(p)}</td><td><span class="et">Pagará con</span>${esc(pago(p))}</td>
        <td class="acciones"><button class="btn btn-sm btn-primary" data-a="aceptar-sol" data-id="${esc(p.id)}">Aceptar</button>
        <button class="btn btn-sm btn-link" data-a="rechazar-sol" data-id="${esc(p.id)}">Rechazar</button></td></tr>`; }).join("")}</tbody></table></div></div>`:"";
  const li=s.invitaciones||[];
  const invs=gest?`<div class="panel"><div class="seccion-cab"><h2>Invitaciones</h2><button class="btn btn-sm btn-primary" data-a="invitar">+ Invitar</button></div>
    <p class="tenue" style="font-size:14px">Cada invitación lleva un código aleatorio de un solo uso. Código general del san: ${s.codigo?`<b class="codigo">${esc(s.codigo)}</b> <button class="btn btn-sm btn-outline-secondary" data-a="copiar" data-id="${esc(s.codigo)}">Copiar</button>`:`<button class="btn btn-sm btn-outline-secondary" data-a="crear-codigo">Crear código</button>`}</p>
    ${li.length?`<div class="tabla-caja"><table><tbody>${li.map(i=>`<tr><td>${esc(i.email)}<br><span class="tenue">${fecha(i.fecha)}</span></td>
      <td><b class="codigo">${esc(i.codigo)}</b></td><td>${i.estado==="Usada"?`<span class="pildora bien">Usada: ${esc(nombreDe(persona(i.personaId)))}</span>`:`<span class="pildora falta">Sin usar</span>`}</td>
      <td class="acciones">${i.estado==="Usada"?"":`<button class="btn btn-sm btn-outline-secondary" data-a="ver-inv" data-id="${esc(i.codigo)}">Ver mensaje</button>
        <button class="btn btn-sm btn-link" data-a="anular-inv" data-id="${esc(i.codigo)}">Anular</button>`}</td></tr>`).join("")}</tbody></table></div>`:""}</div>`:"";
  const com=`<div class="panel"><div class="seccion-cab"><h2>Pautas y chat</h2>${s.publico?`<span class="pildora">En la Comunidad</span>`:`<span class="pildora falta">Privado</span>`}</div>
    <p>${s.pautas?esc(s.pautas):`<span class="tenue">Aún no hay pautas escritas.</span>`}</p>
    <div class="pie"><button class="btn btn-sm btn-primary" data-a="chat-abrir" data-id="${esc(s.id)}">Abrir chat</button>
      ${gest?`<button class="btn btn-sm btn-outline-secondary" data-a="editar-pautas">Editar pautas</button>
      <button class="btn btn-sm btn-outline-secondary" data-a="publicar">${s.publico?"Quitar de la Comunidad":"Publicar en la Comunidad"}</button>`:""}</div></div>`;
  return `<div class="cabecera"><button class="btn btn-sm btn-outline-secondary" data-a="volver">← Sanes</button>
      ${gest?`<button class="btn btn-sm btn-outline-danger" data-a="borrar-san">${S.confirmar==="san"?"Confirmar: eliminar este san":"Eliminar san"}</button>`:""}</div>
    ${card}
    <section class="seccion"><div class="seccion-cab"><h2>Cobros por ronda</h2><span class="rotulo">Vence ${fecha(fechaTurno(s,r))}</span></div>
      <div class="chips" role="group" aria-label="Ronda">${chips}</div>
      ${entrega}
      <ul class="lista">${cuotas||`<li class="vacio-lista">Agrega participantes para empezar a anotar cuotas.</li>`}</ul>
      <p class="tenue" style="font-size:13px">Cobrado en la ronda ${r}: <b class="num">${dinero(recR,s.moneda)}</b> · ${pagadosR.length} de ${ps.length} han pagado.</p></section>
    ${reglasP}${sol}
    <div class="panel"><div class="seccion-cab"><h2>Participantes y turnos</h2>
      ${gest?(ps.length<s.puestos?`<button class="btn btn-sm btn-primary" data-a="nuevo-part">+ Agregar</button>`:`<span class="pildora bien">San completo</span>`):""}</div>
      <p class="tenue" style="font-size:14px">Cada ${unidad(s.frecuencia)} todos pagan ${dinero(s.cuota,s.moneda)} y a quien le toca el turno recibe el bote. El turno 1 cobra primero.</p>
      ${ps.length?`<div class="tabla-caja"><table><tbody>${filas}</tbody></table></div>`:`<p class="tenue">Este san todavía no tiene participantes.</p>`}</div>
    ${invs}${com}`;
}

function filasPersonas(){
  const f=S.filtro.trim().toLowerCase();
  const lista=misPersonas().filter(p=>!f||`${p.nombres} ${p.apellidos} ${p.numDoc} ${p.ciudad||""}`.toLowerCase().includes(f))
    .sort((a,b)=>nombreDe(a).localeCompare(nombreDe(b),"es"));
  if(!lista.length) return `<tr><td class="tenue">Nadie coincide con «${esc(S.filtro)}».</td></tr>`;
  return lista.map(p=>`<tr><td><b>${esc(nombreDe(p))}</b><br><span class="tenue">${esc(p.sexo)} · paga con ${esc(pago(p).toLowerCase())}${p.cuentaId?" · tiene cuenta":""}</span></td>

function vistaParticipante(){
  const p=yo();
  if(!p) return `<div class="panel vacio">${dial(6,1,96)}<h1>Date de alta para unirte a un san</h1>
    <p>Registra tus datos, tu documento de identidad y cómo prefieres pagar las cuotas. El organizador verifica tu documento antes de darte un turno.</p>
    ${S.rw?`<button class="btn btn-primary" data-a="alta">Darme de alta</button>`:""}</div>`;
  const mios=S.sanes.map(s=>({s,x:(s.participantes||[]).find(x=>x.personaId===p.id),sol:(s.solicitudes||[]).find(x=>x.personaId===p.id)})).filter(m=>m.x||(m.sol&&m.sol.estado!=="Aceptada"));
  const activos=mios.filter(m=>m.x);
  const debo=sumar(activos.map(m=>[deudaDe(m.s,p.id),m.s.moneda]));
  const prox=activos.map(m=>({...m,cb:cobroDe(m.s,m.x)})).filter(m=>!m.cb.entrega).sort((a,b)=>a.cb.fecha-b.cb.fecha)[0];
  const card=tarjetaSaldo({etiqueta:"Mi próximo cobro",dcha:prox?`Turno ${prox.x.turno}`:"",monto:prox?dinero(prox.cb.neto,prox.s.moneda):"—",
    sub:prox?`${esc(prox.s.nombre)} · ${fecha(prox.cb.fecha)}${prox.cb.descuento>0?` · se te descuentan ${dinero(prox.cb.descuento,prox.s.moneda)} por cuotas pendientes`:""}`:"Únete a un san para ver aquí tu turno de cobro.",
    pie:[["Debo ahora",verSumas(debo)],["Sanes",String(activos.length)]]});
  const pendientes=activos.flatMap(m=>pendientesDe(m.s,p.id).map(c=>({...m,c})));
  const listaPend=pendientes.map(({s,c})=>`<li><div class="fila"><div class="fila-txt"><b>${esc(s.nombre)} · ronda ${c.r}</b><span>Venció el ${fecha(c.vence)}</span><div class="pildoras">${pildoraCuota(c)}</div></div>
    <div class="fila-monto num">${dinero(s.cuota+c.recargo,s.moneda)}${c.recargo?`<small>recargo ${dinero(c.recargo,s.moneda)}</small>`:""}</div></div></li>`).join("");
  const filas=mios.map(({s,x,sol})=>{ if(!x) return `<li><div class="fila"><div class="fila-txt"><b>${esc(s.nombre)}</b><span>${dinero(s.cuota,s.moneda)} · ${esc(s.frecuencia.toLowerCase())}</span></div>
      <span class="pildora falta">${sol.estado==="Rechazada"?"Solicitud rechazada":"Esperando al organizador"}</span></div></li>`;
    const cb=cobroDe(s,x);
    return `<li><div class="fila"><span class="turno">${x.turno}</span><div class="fila-txt"><b>${esc(s.nombre)}</b><span>Pago ${dinero(s.cuota,s.moneda)} cada ${unidad(s.frecuencia)} · cobro el ${fecha(cb.fecha)}</span></div>
      <div class="fila-monto num">${dinero(cb.entrega?cb.entrega.monto:cb.neto,s.moneda)}<small>${cb.entrega?"ya cobrado":"recibiré"}</small></div></div>
      <div class="fila-acc"><button class="btn btn-sm btn-outline-secondary" data-a="chat-abrir" data-id="${esc(s.id)}">Chat del san</button><span class="tenue" style="font-size:12.5px">${esc(textoReglas(s))}</span></div></li>`; }).join("");
  const h=S.sanes.find(s=>s.id===S.hallado); let vista="";
  if(h){ const n=(h.participantes||[]).length, x=(h.participantes||[]).find(x=>x.personaId===p.id), sol=(h.solicitudes||[]).find(x=>x.personaId===p.id);
    const inv=(h.invitaciones||[]).find(i=>i.codigo===S.invit&&i.estado==="Enviada");
    const estado=x?`<span class="pildora bien">Ya participas: turno ${x.turno}</span>`
      :inv&&n<h.puestos?`<button class="btn btn-primary" data-a="unirse">Unirme al san</button>`
      :sol&&sol.estado==="Pendiente"?`<span class="pildora falta">Solicitud enviada. Espera la respuesta del organizador.</span>`
      :n>=h.puestos?`<span class="pildora falta">Este san ya está completo</span>`
      :`<button class="btn btn-primary" data-a="solicitar">Solicitar un puesto</button>`;
    vista=`<div class="hallado">${dial(h.puestos,n,72)}<div><h3>${esc(h.nombre)}</h3>
      <dl><dt>Cada uno paga</dt><dd class="num">${dinero(h.cuota,h.moneda)} · ${esc(h.frecuencia.toLowerCase())}</dd><dt>Quien cobra recibe</dt><dd class="num">${dinero(h.cuota*h.puestos,h.moneda)}</dd>
      <dt>Fechas</dt><dd>${fecha(h.inicio)} → ${fecha(finDe(h))}</dd><dt>Puestos libres</dt><dd class="num">${h.puestos-n} de ${h.puestos}</dd></dl>
      <p class="tenue" style="font-size:13px;margin-top:8px">${esc(textoReglas(h))}</p>
      <div style="margin-top:10px">${S.rw?estado:""}</div></div></div>`; }
  return `${card}
    ${pendientes.length?`<section class="seccion"><div class="seccion-cab"><h2>Cuotas pendientes</h2><span class="rotulo">${pendientes.length}</span></div><ul class="lista">${listaPend}</ul></section>`:""}
    <section class="seccion"><div class="seccion-cab"><h2>Mis sanes</h2></div><ul class="lista">${filas||`<li class="vacio-lista">Todavía no participas en ningún san. Únete con un código de invitación.</li>`}</ul></section>
    ${S.rw?`<div class="panel"><h2>Unirme con invitación</h2><p class="tenue" style="font-size:14px">Escribe el código de 6 caracteres que te pasó el organizador.</p>
      <div class="unir"><input class="form-control codigo-in" id="codigo" maxlength="6" placeholder="ABC123" value="${esc(S.codigo)}" aria-label="Código de invitación" autocomplete="off">
      <button class="btn btn-primary" data-a="buscar-codigo">Buscar san</button></div>
      ${S.msgCodigo?`<p class="error">${esc(S.msgCodigo)}</p>`:""}${vista}</div>`:""}
    <div class="panel perfil"><div class="seccion-cab"><h2>Mis datos</h2>${S.rw?`<button class="btn btn-sm btn-outline-secondary" data-a="alta">Editar</button>`:""}</div>
      <div class="pildoras">${pildoraVerif(p)}<span class="pildora">Paga con ${esc(pago(p).toLowerCase())}</span></div>
      <dl><dt>Nombre</dt><dd>${esc(nombreDe(p))}</dd><dt>Documento</dt><dd class="num">${esc(verDoc(p))}</dd><dt>Vivienda</dt><dd>${esc(p.direccion)}${p.ciudad?", "+esc(p.ciudad):""}</dd>
      <dt>Contacto</dt><dd>${esc(p.telefono||p.email||"Sin teléfono ni correo")}</dd></dl></div>`;
}

/* ---------- Comunidad ---------- */
const chip=(a,valor,actual,texto)=>`<button class="chip ${valor===actual?"activo":""}" data-a="${a}" data-id="${valor}" aria-pressed="${valor===actual}">${texto}</button>`;
function listaComunidad(){
  const q=S.comQ.trim().toLowerCase(), h=isoLocal(hoy()), en30=isoLocal(new Date(Date.now()+30*DIA));
  const lista=S.sanes.filter(s=>s.publico)
    .filter(s=>!S.comFrec||s.frecuencia===S.comFrec)
    .filter(s=>!S.comCuota||(S.comCuota==="baja"?s.cuota<=50:S.comCuota==="media"?s.cuota>50&&s.cuota<=150:s.cuota>150))
    .filter(s=>!q||`${s.nombre} ${s.ciudad||""} ${organiza(s)}`.toLowerCase().includes(q))
    .sort((a,b)=>a.inicio.localeCompare(b.inicio));
  const abierto=s=>(s.participantes||[]).length<s.puestos&&s.inicio>=h;
  const grupos=[["Empiezan pronto","Con puestos libres y primer turno en menos de un mes.",lista.filter(s=>abierto(s)&&s.inicio<=en30)],
                ["Más adelante","Con puestos libres; todavía hay tiempo para organizarse.",lista.filter(s=>abierto(s)&&s.inicio>en30)],
                ["Completos o en marcha","Ya no admiten participantes.",lista.filter(s=>!abierto(s))]];
  const tarjeta=s=>{ const n=(s.participantes||[]).length, libre=abierto(s);
    return `<button class="cuenta" data-a="com-abrir" data-id="${esc(s.id)}"><div><h3>${esc(s.nombre)}</h3>
      <p class="tenue" style="font-size:13px">Organiza ${esc(organiza(s))}${s.ciudad?" · "+esc(s.ciudad):""}</p>
      <div class="pildoras"><span class="pildora ${libre?"bien":"falta"}">${libre?`Quedan ${s.puestos-n} puestos`:n>=s.puestos?"Completo":"Ya empezó"}</span>
      ${soyMiembro(s)?`<span class="pildora">${s.dueno===uid()?"Lo organizas tú":"Participas"}</span>`:""}</div>
      <dl><dt>Cuota</dt><dd class="num">${dinero(s.cuota,s.moneda)} · ${esc(s.frecuencia.toLowerCase())}</dd>
          <dt>Bote</dt><dd class="num">${dinero(s.cuota*s.puestos,s.moneda)}</dd><dt>Empieza</dt><dd>${fecha(s.inicio)}</dd></dl></div>${dial(s.puestos,n,64)}</button>`; };
  const html=grupos.filter(g=>g[2].length).map(([t,d,l])=>`<section class="seccion"><div class="seccion-cab"><h2>${t}</h2><span class="rotulo">${l.length}</span></div><p class="tenue" style="font-size:13px">${d}</p><div class="cuentas">${l.map(tarjeta).join("")}</div></section>`).join("");
  return html||`<div class="panel vacio"><p>${S.sanes.some(s=>s.publico)?"Ningún san coincide con esos filtros. Prueba a quitar alguno.":"Todavía nadie ha publicado un san en la Comunidad."}</p></div>`;
}
function vistaComunidad(){
  return `<div class="cabecera"><div><h1>Comunidad</h1><p class="tenue">Sanes abiertos a gente nueva. Entra en uno para ver sus pautas y pedir un puesto.</p></div></div>
    <input class="form-control buscar" id="com-buscar" type="search" placeholder="Buscar por nombre, ciudad u organizador" value="${esc(S.comQ)}" aria-label="Buscar sanes">
    <div class="chips" role="group" aria-label="Frecuencia">${chip("com-frec","",S.comFrec,"Todos")}${chip("com-frec","Semanal",S.comFrec,"Semanales")}${chip("com-frec","Quincenal",S.comFrec,"Quincenales")}${chip("com-frec","Mensual",S.comFrec,"Mensuales")}</div>
    <div class="chips" role="group" aria-label="Cuota">${chip("com-cuota","",S.comCuota,"Cualquier cuota")}${chip("com-cuota","baja",S.comCuota,"Hasta 50 €")}${chip("com-cuota","media",S.comCuota,"51 a 150 €")}${chip("com-cuota","alta",S.comCuota,"Más de 150 €")}</div>
    <div id="com-lista">${listaComunidad()}</div>`;
}
function vistaComSan(){
  const s=S.sanes.find(x=>x.id===S.comSan); if(!s) return vistaComunidad();
  const n=(s.participantes||[]).length, h=isoLocal(hoy()), p=yo(), sol=p&&(s.solicitudes||[]).find(x=>x.personaId===p.id);
  const accion=s.dueno===uid()?`<button class="btn btn-primary" data-a="chat-abrir" data-id="${esc(s.id)}">Abrir chat del san</button>${S.rol==="organizador"?` <button class="btn btn-outline-secondary" data-a="com-gestionar" data-id="${esc(s.id)}">Gestionar este san</button>`:""}`
    :soyMiembro(s)?`<button class="btn btn-primary" data-a="chat-abrir" data-id="${esc(s.id)}">Abrir chat del san</button>`
    :sol&&sol.estado==="Pendiente"?`<span class="pildora falta">Solicitud enviada. Espera la respuesta del organizador.</span>`
    :n>=s.puestos?`<span class="pildora falta">Este san ya está completo</span>`
    :s.inicio<h?`<span class="pildora falta">Este san ya empezó</span>`
    :!S.rw?"":p?`<button class="btn btn-primary" data-a="com-solicitar">Solicitar un puesto</button>`
    :`<button class="btn btn-primary" data-a="alta">Darme de alta para pedir un puesto</button>`;
  return `<div class="cabecera"><button class="btn btn-sm btn-outline-secondary" data-a="com-volver">← Comunidad</button></div>
    ${tarjetaSaldo({etiqueta:s.nombre,dcha:s.ciudad||"",monto:dinero(s.cuota*s.puestos,s.moneda),sub:`Bote de cada ${unidad(s.frecuencia)} · organiza ${esc(organiza(s))}`,
      pie:[["Cuota",dinero(s.cuota,s.moneda)],["Puestos libres",`${Math.max(0,s.puestos-n)} de ${s.puestos}`],["Empieza",fecha(s.inicio)]]})}
    <div class="panel"><h2>Pautas del san</h2><p>${s.pautas?esc(s.pautas):`<span class="tenue">El organizador aún no ha escrito las pautas.</span>`}</p>

    <div class="panel"><div class="pie">${accion}</div>
      ${soyMiembro(s)?"":`<p class="tenue" style="font-size:13px">El chat del san se abre cuando el organizador te acepta.</p>`}</div>`;
}

function calculoSan(){

    <label class="ancho" for="pau-texto">Pautas: cómo y cuándo se paga, qué pasa si alguien se retrasa<textarea class="form-control" id="pau-texto" name="pautas" rows="5" maxlength="600">${esc(s.pautas||"")}</textarea></label></div>
    ${pieDlg("Guardar")}</form>`);
}
function dlgReglas(){
  const s=S.sanes.find(x=>x.id===S.sanId); if(!s) return; const R=reglas(s);
  abrir(`<form data-f="reglas" novalidate><h2>Reglas de retraso</h2><p class="tenue">${esc(s.nombre)} · cuota de ${dinero(s.cuota,s.moneda)}</p><div class="campos">
    <label for="reg-gracia">Días de gracia<input class="form-control" id="reg-gracia" name="diasGracia" type="number" min="0" max="60" value="${R.diasGracia}"></label>
    <label for="reg-multa">Multa fija (${esc(s.moneda)})<input class="form-control" id="reg-multa" name="multa" inputmode="decimal" value="${R.multa}"></label>
    <label for="reg-interes">Interés por día (% de la cuota)<input class="form-control" id="reg-interes" name="interesDiario" inputmode="decimal" value="${R.interesDiario}"></label>
    <label for="reg-tope">Interés máximo (% de la cuota, 0 = sin límite)<input class="form-control" id="reg-tope" name="tope" inputmode="decimal" value="${R.tope}"></label>
    <label class="ancho" for="reg-desc">Si alguien debe cuotas cuando le toca cobrar<select class="form-select" id="reg-desc" name="descontar">
      <option value="si"${R.descontar?" selected":""}>Se le descuenta lo que debe de su cobro</option><option value="no"${R.descontar?"":" selected"}>Cobra el bote completo</option></select></label></div>
    <p class="calculo" id="reg-calculo"></p>
    <p class="tenue" style="font-size:13px">Los cambios se aplican a las cuotas que aún no se han pagado. Las ya cobradas guardan el recargo con el que se registraron.</p>
    ${pieDlg("Guardar reglas")}</form>`);
  calculoReglas();
}
function leerReglas(f){ return {diasGracia:Math.max(0,parseInt(f.diasGracia.value,10)||0),multa:Math.max(0,num(f.multa.value)||0),
  interesDiario:Math.max(0,num(f.interesDiario.value)||0),tope:Math.max(0,num(f.tope.value)||0),descontar:f.descontar.value==="si"}; }
function calculoReglas(){
  const f=dlg.querySelector("form[data-f=reglas]"); if(!f) return; const s=S.sanes.find(x=>x.id===S.sanId), R=leerReglas(f);
  $("#reg-calculo").textContent=`${textoReglas(s,R)} Con 5 días de retraso el recargo sería ${dinero(recargoDe(s,5,R),s.moneda)}; con 15 días, ${dinero(recargoDe(s,15,R),s.moneda)}; con 30 días, ${dinero(recargoDe(s,30,R),s.moneda)}.`;
}
function dlgPago(sid,r,pid){
  const s=S.sanes.find(x=>x.id===sid), x=s&&(s.participantes||[]).find(z=>z.personaId===pid); if(!x) return;
  const c=estadoCuota(s,r,pid), R=reglas(s), p=persona(pid);
  abrir(`<form data-f="pago" data-s="${esc(sid)}" data-r="${r}" data-p="${esc(pid)}" novalidate><h2>Registrar pago</h2>
    <p class="tenue">${esc(nombrePart(s,x))} · ${esc(s.nombre)} · ronda ${r}</p>
    <dl class="recibo"><dt>Cuota</dt><dd class="num">${dinero(s.cuota,s.moneda)}</dd><dt>Vencía el</dt><dd>${fecha(c.vence)}</dd>
      <dt>Retraso</dt><dd id="pago-dias">${c.dias>0?`${c.dias} días`:"Ninguno"}</dd><dt class="total">Total</dt><dd class="total num" id="pago-total">${dinero(s.cuota+c.recargo,s.moneda)}</dd></dl>
    <div class="campos">
      <label for="pago-fecha">Fecha del pago<input class="form-control" id="pago-fecha" name="fecha" type="date" value="${isoLocal(hoy())}"></label>
      <label for="pago-recargo">Recargo (${esc(s.moneda)})<input class="form-control" id="pago-recargo" name="recargo" inputmode="decimal" value="${c.recargo.toFixed(2)}"></label>
      <label class="ancho" for="pago-metodo">Forma de pago<select class="form-select" id="pago-metodo" name="metodo">${opciones(METODOS,pago(p))}</select></label></div>
    <p class="tenue" style="font-size:13px">El recargo se calcula con las reglas del san (${R.diasGracia} días de gracia). Puedes cambiarlo o ponerlo a 0 para perdonarlo.</p>
    ${pieDlg("Guardar pago")}</form>`);
}
function calculoPago(e){
  const f=dlg.querySelector("form[data-f=pago]"); if(!f) return;
  const s=S.sanes.find(x=>x.id===f.dataset.s), r=+f.dataset.r; if(!s) return;
  if(e&&e.target&&e.target.name==="fecha"&&f.fecha.value){ const dias=diasEntre(fechaTurno(s,r),new Date(f.fecha.value+"T12:00:00"));
    f.recargo.value=recargoDe(s,dias).toFixed(2); $("#pago-dias").textContent=dias>0?`${dias} días`:"Ninguno"; }
  $("#pago-total").textContent=dinero(s.cuota+(num(f.recargo.value)||0),s.moneda);
}
function dlgAviso(sid,r,pid){

  const wa=`https://wa.me/${tel}?text=${encodeURIComponent(txt)}`;
  abrir(`<form data-f="nada" data-s="${esc(sid)}" data-k="${esc(c.k)}"><h2>Aviso de retraso</h2>
    <p class="tenue">Para ${esc(nombrePart(s,x))}${p&&p.telefono?` · <span class="num">${esc(p.telefono)}</span>`:" · sin teléfono registrado"}</p>
    <textarea class="form-control" id="aviso-texto" rows="11" readonly aria-label="Mensaje de aviso">${esc(txt)}</textarea>
    ${p&&p.email?`<p class="correo-para"><span class="tenue">Correo:</span> <b>${esc(p.email)}</b></p>`:`<p class="tenue" style="font-size:13px">Esta persona no tiene correo registrado. Puedes añadirlo en Personas → Editar.</p>`}
    <p class="tenue" style="font-size:13px">«Enviar con Gmail» abre tu Gmail con el correo ya escrito: solo tienes que pulsar Enviar allí. Después márcalo como avisado aquí.</p>
    <div class="pie"><a class="btn btn-primary" href="${esc(gmailURL(p&&p.email,`Aviso de cuota pendiente · ${s.nombre}`,txt))}" target="_blank" rel="noopener">Enviar con Gmail</a>

      <button type="button" class="btn btn-outline-secondary" data-a="marcar-aviso">Marcar como avisado</button></div></form>`);
}
