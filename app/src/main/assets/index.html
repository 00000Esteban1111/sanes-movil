/* ---------- Envío de formularios ---------- */
dlg.addEventListener("input",e=>{ calculoSan(); ayudaDoc(); calculoPago(e); calculoReglas(); const er=dlg.querySelector(".error"); if(er) er.hidden=true; });
document.addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target, v=Object.fromEntries(new FormData(f)), err=f.querySelector(".error");
  const fallo=t=>{ if(err){ err.textContent=t; err.hidden=false; } else tostada(t); };
  for(const k in v) v[k]=String(v[k]).trim();
  const boton=f.querySelector("button.btn-primary:not([type=button])"); if(boton) boton.disabled=true;
  try{
    if(f.dataset.f==="crear-cuenta"){
      const email=(v.correo||"").toLowerCase();
      if(!correoValido(email)) return fallo("Escribe un correo válido, como nombre@correo.com.");
      const mal=revisarClaves(v); if(mal) return fallo(mal);
      const antes=S.cuenta; S.cuenta=await cuentaNueva(email,v.clave);
      try{ await guardarAjustes(); }catch(x){ S.cuenta=antes; return fallo("No se pudo crear el acceso: "+msgError(x)); }
      desbloquear(); tostada("Acceso creado. En Perfil puedes poner un PIN o un patrón para entrar más rápido.");
    }
    else if(f.dataset.f==="entrar-clave"){
      if(Date.now()<S.esperaHasta) return fallo("Demasiados intentos. Espera unos segundos.");
      const email=(v.correo||"").toLowerCase();
      if(!email||!v.clave) return fallo("Escribe tu correo y tu contraseña.");
      const ok=email===S.cuenta.email&&(await derivarClave(v.clave,S.cuenta.sal,S.cuenta.iter))===S.cuenta.hash;
      if(!ok){ S.intentos++; agitar("login");
        if(S.intentos>=5){ S.intentos=0; S.esperaHasta=Date.now()+30000; return fallo("Demasiados intentos. Espera 30 segundos."); }
        return fallo(`El correo o la contraseña no son correctos. Te quedan ${5-S.intentos} ${5-S.intentos===1?"intento":"intentos"}.`); }
      entrarConClave();
    }
    else if(f.dataset.f==="reset-clave"){
      const mal=revisarClaves(v); if(mal) return fallo(mal);
      const antes=S.cuenta; S.cuenta=await cuentaNueva(antes.email,v.clave);
      try{ await guardarAjustes(); }catch(x){ S.cuenta=antes; return fallo("No se pudo guardar: "+msgError(x)); }
      entrarConClave(); tostada("Contraseña cambiada.");
    }
    else if(f.dataset.f==="cambiar-clave"){
      if(!(await derivarClave(v.actual||"",S.cuenta.sal,S.cuenta.iter)===S.cuenta.hash)) return fallo("La contraseña actual no es correcta.");
      const mal=revisarClaves(v); if(mal) return fallo(mal);
      const antes=S.cuenta; S.cuenta=await cuentaNueva(antes.email,v.clave);
      try{ await guardarAjustes(); }catch(x){ S.cuenta=antes; return fallo("No se pudo guardar: "+msgError(x)); }
      dlg.close(); tostada("Contraseña cambiada.");
    }
    else if(f.dataset.f==="perfil"){
      if(!v.nombre) return fallo("Escribe el nombre que verán los demás.");
      if(v.correoContacto&&!correoValido(v.correoContacto)) return fallo("El correo de contacto no parece válido. Revísalo o déjalo vacío.");
      if(v.telefono&&!/^[+\d][\d\s().-]{5,24}$/.test(v.telefono)) return fallo("El teléfono solo puede llevar números, espacios y el signo +.");
      const actual=perfilDe(uid());
      const foto=S.fotoNueva===undefined?(actual.foto||""):S.fotoNueva;
      await escribir(db=>db.doc("perfiles/"+uid()).set({nombre:v.nombre.slice(0,60),foto,telefono:v.telefono,ciudad:v.ciudad,correoContacto:v.correoContacto.toLowerCase(),bio:v.bio.slice(0,200),actualizado:new Date().toISOString()}));
      S.fotoNueva=undefined; dlg.close(); tostada("Perfil guardado.");
    }
    else if(f.dataset.f==="chat"){
      const s=S.sanes.find(x=>x.id===S.chatSan); if(!s||!v.texto) return;
      S.borrador=""; f.texto.value="";
      await escribir(db=>db.collection("sanes/"+s.id+"/mensajes").add({autor:uid(),texto:v.texto.slice(0,500),fecha:new Date().toISOString()}));
      if($("#chat-in")) $("#chat-in").focus();
    }
    else if(f.dataset.f==="pautas"){ await actualizarSan(f.dataset.id,{ciudad:v.ciudad,pautas:v.pautas}); dlg.close(); tostada("Pautas guardadas."); }
    else if(f.dataset.f==="san"){
      const cuota=num(v.cuota), puestos=parseInt(v.puestos,10);
      if(!v.nombre) return fallo("Ponle un nombre al san.");
      if(!(cuota>0)) return fallo("La cuota debe ser un número mayor que cero.");
      if(!(puestos>=2&&puestos<=50)) return fallo("El san necesita entre 2 y 50 puestos.");
      if(!v.inicio) return fallo("Indica la fecha del primer turno.");
      const id=await guardar("sanes",null,{nombre:v.nombre,cuota,moneda:v.moneda,frecuencia:v.frecuencia,puestos,inicio:v.inicio,dueno:uid(),estado:"Activo",publico:false,ciudad:"",pautas:"",
        participantes:[],solicitudes:[],invitaciones:[],codigo:codigoNuevo(),reglas:{...REGLAS_BASE},pagos:{},entregas:{},avisos:{},creado:new Date().toISOString()});
      S.sanId=id; S.ronda=null; S.vista="sanes"; dlg.close(); render(); tostada("San creado. Ahora agrega a los participantes.");
    }
    else if(f.dataset.f==="persona"){
      const id=f.dataset.id||null;
      const falta=[["nombres","los nombres"],["apellidos","los apellidos"],["numDoc","el número de documento"],["direccion","la dirección de vivienda"]].find(([k])=>!v[k]);
      if(falta) return fallo(`Falta ${falta[1]}.`);
      const doc=validarDocumento(v.tipoDoc,v.numDoc); if(doc.error) return fallo(doc.error);
      v.numDoc=doc.valor;
      if(v.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) return fallo("El correo no parece válido. Revísalo o déjalo vacío.");
      if(S.personas.some(p=>p.id!==id&&p.tipoDoc===v.tipoDoc&&p.numDoc===v.numDoc)) return fallo("Ya hay una persona registrada con ese documento.");
      const previo=id?persona(id):null, mismoDoc=previo&&previo.tipoDoc===v.tipoDoc&&previo.numDoc===v.numDoc;
      const nid=await guardar("personas",id,{...v,cuentaId:previo?(previo.cuentaId||null):(f.dataset.alta?uid():null),dueno:previo?(previo.dueno||null):(f.dataset.alta?null:uid()),
        verificacion:mismoDoc?(previo.verificacion||"Pendiente"):"Pendiente",creado:previo?.creado||new Date().toISOString()});
      if(f.dataset.volver){ if(!S.personas.some(p=>p.id===nid)) S.personas.push({id:nid,...v,dueno:uid()}); dlgParticipante(nid); }
      else { dlg.close(); tostada(id?"Cambios guardados.":f.dataset.alta?"Alta completada. Ya puedes unirte con un código.":"Persona registrada."); }
    }
    else if(f.dataset.f==="invitar"){
      const s=S.sanes.find(x=>x.id===S.sanId), quien=v.email;
      if(!quien) return fallo("Escribe el nombre o el correo de la persona para reconocer la invitación.");
      const codigo=codigoNuevo(), inv={email:quien,codigo,estado:"Enviada",fecha:isoLocal(hoy())};
      await actualizarSan(s.id,{invitaciones:(s.invitaciones||[]).concat(inv)});
      dlgMensaje(codigo);
    }
    else if(f.dataset.f==="part"){
      const s=S.sanes.find(x=>x.id===S.sanId), ps=(s.participantes||[]).map(x=>({...x}));
      if(!v.personaId) return fallo("Elige a la persona.");
      if(v.avalistaId===v.personaId) return fallo("Una persona no puede avalarse a sí misma.");
      if(ps.length>=s.puestos) return fallo("Este san ya tiene todos sus puestos ocupados.");
      const turno=turnoLibre(ps);
      ps.push({personaId:v.personaId,nombre:nombreDe(persona(v.personaId)),turno,avalistaId:v.avalistaId||null});
      await actualizarSan(s.id,{participantes:ps}); dlg.close(); tostada(`Agregado en el turno ${turno}.`);
    }
    else if(f.dataset.f==="reglas"){
      await actualizarSan(S.sanId,{reglas:leerReglas(f)}); dlg.close(); tostada("Reglas de retraso guardadas.");
    }
    else if(f.dataset.f==="pago"){
      const s=S.sanes.find(x=>x.id===f.dataset.s), r=+f.dataset.r, pid=f.dataset.p, x=(s.participantes||[]).find(z=>z.personaId===pid);
      const recargo=num(v.recargo); if(!(recargo>=0)) return fallo("El recargo debe ser 0 o un número positivo.");
      if(!v.fecha) return fallo("Indica la fecha del pago.");
      await actualizarSan(s.id,{pagos:{[claveCuota(r,pid)]:{ronda:r,personaId:pid,nombre:nombrePart(s,x),fecha:v.fecha,monto:s.cuota,recargo:redondo(recargo),metodo:v.metodo}}});
      dlg.close(); tostada(`Pago de ${dinero(s.cuota+recargo,s.moneda)} registrado.`);
    }
    else if(f.dataset.f==="entrega"){
      const s=S.sanes.find(x=>x.id===S.sanId), r=+f.dataset.r, x=(s.participantes||[]).find(z=>z.turno===r), cb=cobroDe(s,x);
      const monto=num(v.monto); if(!(monto>=0)) return fallo("El monto debe ser un número.");
      const saldar={};
      if(reglas(s).descontar) for(const c of pendientesDe(s,x.personaId)) saldar[c.k]={ronda:c.r,personaId:x.personaId,nombre:nombrePart(s,x),fecha:v.fecha,monto:s.cuota,recargo:c.recargo,metodo:"Descontado del cobro"};
      await actualizarSan(s.id,{entregas:{["r"+r]:{fecha:v.fecha,monto:redondo(monto),descuento:cb.descuento,nombre:nombrePart(s,x),personaId:x.personaId}},pagos:saldar});
      dlg.close(); tostada(`Entrega de ${dinero(monto,s.moneda)} registrada.`);
    }
  }catch(ex){ console.error(ex); fallo("No se pudo guardar: "+ex.message); }
  finally{ if(boton&&boton.isConnected) boton.disabled=false; }
});

/* ---------- Acciones ---------- */
document.addEventListener("input",e=>{
  if(e.target.id==="codigo") S.codigo=e.target.value;
  if(e.target.id==="chat-in") S.borrador=e.target.value;
  if(e.target.id==="com-buscar"){ S.comQ=e.target.value; $("#com-lista").innerHTML=listaComunidad(); }
  if(e.target.id==="buscar"){ S.filtro=e.target.value; $("#lista-personas").innerHTML=filasPersonas(); }
});
const guardarRol=r=>{ try{ r?localStorage.setItem("sanes-rol",r):localStorage.removeItem("sanes-rol"); }catch(x){} };
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a, id=b.dataset.id;
  if(a==="tab"||a==="rol") e.preventDefault();
  if(a!=="borrar-san"&&a!=="borrar-persona"&&a!=="quitar-bloqueo") S.confirmar=null;
  try{
    if(a==="rol"){ S.rol=id; S.rolElegido=id; S.vista="inicio"; S.sanId=null; S.comSan=null; guardarRol(id); render(); window.scrollTo(0,0); }
    else if(a==="elegir-rol"){
      S.rolElegido=id; guardarRol(id); const seg=b.closest(".segmento"); seg.dataset.sel=id;
      seg.querySelectorAll("button").forEach(x=>{ const on=x.dataset.id===id; x.classList.toggle("activo",on); x.setAttribute("aria-pressed",String(on)); });
      render.ultimo=null;
    }
    else if(a==="entrar") desbloquear();
    else if(a==="bloquear"){ if(S.chatSan) cerrarChat(); if(dlg.open) dlg.close(); S.desbloqueado=false; S.modoLogin=null; S.tras=null; S.sanId=null; S.hallado=null; pinBuf=""; loginAnimado=false; render(); window.scrollTo(0,0); }
    else if(a==="tecla") pulsarTecla(id);
    else if(a==="olvido"){ S.modoLogin="clave"; S.tras="nuevo-bloqueo"; pinBuf=""; render(); }
    else if(a==="modo-login"){ S.modoLogin=id||null; if(!id) S.tras=null; pinBuf=""; render(); const c=$("#lg-clave"); if(c) c.focus(); }
    else if(a==="ver-clave"){ const i=b.parentNode.querySelector("input"); const ver=i.type==="password"; i.type=ver?"text":"password"; b.textContent=ver?"Ocultar":"Ver"; }
    else if(a==="poner-bloqueo") dlgBloqueo(id);
    else if(a==="quitar-bloqueo"){
      if(S.confirmar!=="bloqueo"){ S.confirmar="bloqueo"; render(); return; }
      S.confirmar=null; const antes=S.bloqueo; S.bloqueo=null;
      try{ await guardarAjustes(); }catch(x){ S.bloqueo=antes; throw x; }
      render(); tostada(S.cuenta?"Bloqueo quitado. Entrarás con tu correo y contraseña.":"Bloqueo quitado.");
    }
    else if(a==="cambiar-clave") dlgCambiarClave();
    else if(a==="editar-perfil"){ if(S.rw) dlgPerfil(); }
    else if(a==="quitar-foto"){ S.fotoNueva=""; $("#pf-vista").innerHTML=`<span class="avatar avatar-ini" style="width:80px;height:80px;font-size:30px">${esc(iniciales(miNombre()))}</span>`; b.remove(); }
    else if(a==="tab"){ S.sanId=null; S.comSan=null; if(S.chatSan) cerrarChat(); S.vista=id; if(location.hash!=="#"+id) history.replaceState(null,"","#"+id); render(); window.scrollTo(0,0); }
    else if(a==="nuevo-san") dlgSan();
    else if(a==="abrir-san"){ S.sanId=id; S.ronda=null; render(); window.scrollTo(0,0); }
    else if(a==="volver"){ S.sanId=null; render(); }
    else if(a==="ronda"){ S.ronda=+id; render(); }
    else if(a==="cerrar") dlg.close();
    else if(a==="nueva-persona") dlgPersona(null,false);
    else if(a==="editar-persona") dlgPersona(id,false);
    else if(a==="persona-para-san") dlgPersona(null,true);
    else if(a==="nuevo-part") dlgParticipante();
    else if(a==="cobrar") dlgPago(b.dataset.s,+b.dataset.r,b.dataset.p);
    else if(a==="avisar") dlgAviso(b.dataset.s,+b.dataset.r,b.dataset.p);
    else if(a==="editar-reglas") dlgReglas();
    else if(a==="entregar") dlgEntrega(+b.dataset.r);
    else if(a==="marcar-aviso"){ const f=b.closest("form"); await actualizarSan(f.dataset.s,{avisos:{[f.dataset.k]:isoLocal(hoy())}}); dlg.close(); tostada("Aviso anotado."); }
    else if(a==="deshacer-pago"){ const s=S.sanes.find(x=>x.id===S.sanId); await actualizarSan(s.id,{pagos:{[claveCuota(+b.dataset.r,b.dataset.p)]:null}}); tostada("Pago deshecho. La cuota vuelve a estar pendiente."); }
    else if(a==="deshacer-entrega"){
      const s=S.sanes.find(x=>x.id===S.sanId), r=+b.dataset.r, x=(s.participantes||[]).find(z=>z.turno===r), quitar={};
      for(const [k,p] of Object.entries(s.pagos||{})) if(p&&x&&p.personaId===x.personaId&&p.metodo==="Descontado del cobro") quitar[k]=null;
      await actualizarSan(s.id,{entregas:{["r"+r]:null},pagos:quitar}); tostada("Entrega deshecha.");
    }
    else if(a==="quitar-part"){
      const s=S.sanes.find(x=>x.id===S.sanId);
      await actualizarSan(s.id,{participantes:(s.participantes||[]).filter(x=>x.personaId!==id)}); tostada("Participante quitado. Su turno queda libre.");
    }
    else if(a==="borrar-san"){
      if(S.confirmar!=="san"){ S.confirmar="san"; render(); return; }
      const sid=S.sanId; S.confirmar=null; S.sanId=null; await borrar("sanes",sid); render(); tostada("San eliminado.");
    }
    else if(a==="borrar-persona"){
      const enUso=S.sanes.find(s=>(s.participantes||[]).some(x=>x.personaId===id||x.avalistaId===id));
      if(enUso){ tostada(`No se puede eliminar: participa o avala en «${enUso.nombre}».`); return; }
      if(S.confirmar!==id){ S.confirmar=id; render(); return; }
      S.confirmar=null; await borrar("personas",id); tostada("Persona eliminada.");
    }
    else if(a==="alta") dlgPersona(yo()?.id||null,false,true);
    else if(a==="verificar"){ const p=persona(id); await guardar("personas",id,{...cuerpo(p),verificacion:p.verificacion==="Verificado"?"Pendiente":"Verificado"}); }
    else if(a==="crear-codigo"){ await actualizarSan(S.sanId,{codigo:codigoNuevo()}); }
    else if(a==="copiar"){ try{ await navigator.clipboard.writeText(id); tostada("Código copiado."); }catch(x){ tostada("No se pudo copiar. El código es "+id); } }
    else if(a==="aceptar-sol"||a==="rechazar-sol"){
      const s=S.sanes.find(x=>x.id===S.sanId), ps=(s.participantes||[]).map(x=>({...x}));
      if(a==="aceptar-sol"){
        if(ps.length>=s.puestos){ tostada("El san ya está completo."); return; }
        const t=turnoLibre(ps); ps.push({personaId:id,nombre:nombreDe(persona(id)),turno:t,avalistaId:null}); tostada(`Aceptado en el turno ${t}. Falta asignarle avalista.`);
      } else tostada("Solicitud rechazada.");
      await actualizarSan(s.id,{participantes:ps,solicitudes:(s.solicitudes||[]).map(x=>x.personaId===id?{...x,estado:a==="aceptar-sol"?"Aceptada":"Rechazada"}:x)});
    }
    else if(a==="buscar-codigo"){
      const c=S.codigo.trim().toUpperCase(); let s=S.sanes.find(x=>x.codigo===c), usada=false; S.invit=null;
      if(!s&&c) for(const z of S.sanes){ const i=(z.invitaciones||[]).find(i=>i.codigo===c); if(i){ if(i.estado==="Enviada"){ s=z; S.invit=c; } else usada=true; break; } }
      S.hallado=s?s.id:null; S.msgCodigo=!c?"Escribe el código que te dio el organizador.":s?"":usada?"Ese código ya se usó. Pide al organizador una invitación nueva.":"No hay ningún san con ese código. Revisa que esté bien escrito.";
      render();
    }
    else if(a==="solicitar"||a==="com-solicitar"){
      const s=S.sanes.find(x=>x.id===(a==="solicitar"?S.hallado:S.comSan)), p=yo();
      await actualizarSan(s.id,{solicitudes:(s.solicitudes||[]).filter(x=>x.personaId!==p.id).concat({personaId:p.id,fecha:isoLocal(hoy()),estado:"Pendiente"})});
      tostada("Solicitud enviada al organizador.");
    }
    else if(a==="unirse"){
      const s=S.sanes.find(x=>x.id===S.hallado), p=yo(), ps=(s.participantes||[]).map(x=>({...x}));
      if(ps.length>=s.puestos){ tostada("El san ya está completo."); return; }
      const t=turnoLibre(ps); ps.push({personaId:p.id,nombre:nombreDe(p),turno:t,avalistaId:null});
      await actualizarSan(s.id,{participantes:ps,invitaciones:(s.invitaciones||[]).map(i=>i.codigo===S.invit?{...i,estado:"Usada",personaId:p.id}:i)});
      S.invit=null; tostada(`Te uniste al san. Tu turno es el ${t}.`);
    }
    else if(a==="com-frec"){ S.comFrec=id; render(); }
    else if(a==="com-cuota"){ S.comCuota=id; render(); }
    else if(a==="com-abrir"){ S.comSan=id; render(); window.scrollTo(0,0); }
    else if(a==="com-volver"){ S.comSan=null; render(); }
    else if(a==="com-gestionar"){ S.comSan=null; S.vista="sanes"; S.sanId=id; S.ronda=null; render(); window.scrollTo(0,0); }
    else if(a==="chat-abrir") abrirChat(id);
    else if(a==="chat-cerrar"){ cerrarChat(); render(); }
    else if(a==="editar-pautas") dlgPautas();
    else if(a==="publicar"){ const s=S.sanes.find(x=>x.id===S.sanId); await actualizarSan(s.id,{publico:!s.publico}); tostada(s.publico?"El san ya no aparece en la Comunidad.":"San publicado en la Comunidad."); }
    else if(a==="invitar") dlgInvitar();
    else if(a==="ver-inv") dlgMensaje(id);
    else if(a==="anular-inv"){ const s=S.sanes.find(x=>x.id===S.sanId); await actualizarSan(s.id,{invitaciones:(s.invitaciones||[]).filter(i=>i.codigo!==id)}); tostada("Invitación anulada. Ese código ya no sirve."); }
    else if(a==="copiar-texto"){ const t=dlg.querySelector("textarea"); try{ await navigator.clipboard.writeText(t.value); tostada("Mensaje copiado."); }catch(x){ t.select(); tostada("Selecciona el texto y cópialo a mano."); } }
  }catch(ex){ console.error(ex); tostada("No se pudo completar: "+ex.message); }
});

/* ---------- Entrada rápida: PIN o patrón ---------- */
const refAjustes=()=>S.db.doc("data/users/"+S.uid+"/ajustes");
async function hashCodigo(sal,cod){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(sal+"|"+cod)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function salNueva(){ const r=new Uint8Array(16); crypto.getRandomValues(r); return [...r].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function desbloquear(){
  S.desbloqueado=true; S.modoLogin=null; S.intentos=0; pinBuf="";
  S.rol=S.rw?S.rolElegido:"consulta"; S.vista=VISTAS.includes(location.hash.slice(1))?location.hash.slice(1):"inicio";
  render(); window.scrollTo(0,0);
}
const enConfig=()=>dlg.open&&!!dlg.querySelector(".oscuro");
function pintarPuntos(){ const el=enConfig()?dlg.querySelector("#pin-puntos"):$("#app #pin-puntos"); if(el) el.outerHTML=puntosHTML(); }
function aviso(ctx,t,mal){ const el=ctx==="config"?dlg.querySelector("#cfg-msg"):$("#login-msg"); if(el){ el.textContent=t; el.className="login-msg"+(mal?" mal":""); } }
function agitar(ctx){ const el=ctx==="config"?dlg.querySelector(".oscuro"):$(".login"); if(!el) return; el.classList.remove("agita"); void el.offsetWidth; el.classList.add("agita"); }
function pulsarTecla(d){
  const ctx=enConfig()?"config":"login";
  if(ctx==="login"&&Date.now()<S.esperaHasta) return;
  if(d==="borrar") pinBuf=pinBuf.slice(0,-1); else if(pinBuf.length<PIN_LARGO) pinBuf+=d;
  pintarPuntos();
  if(pinBuf.length===PIN_LARGO){ const c=pinBuf; setTimeout(()=>recibirCodigo(ctx,c),150); }
}
function recibirCodigo(ctx,cod){ return ctx==="config"?configurar(cod):comprobar(cod); }
async function comprobar(cod){
  if(!S.bloqueo||Date.now()<S.esperaHasta) return;
  const h=await hashCodigo(S.bloqueo.sal,cod);
  if(h===S.bloqueo.hash){ desbloquear(); return; }
  S.intentos++; pinBuf=""; pintarPuntos(); agitar("login");
  const que=S.bloqueo.tipo==="pin"?"PIN incorrecto":"Patrón incorrecto";
  if(S.intentos>=5){ S.intentos=0; S.esperaHasta=Date.now()+30000; aviso("login","Demasiados intentos. Espera 30 segundos.",true);
    setTimeout(()=>{ if(!S.desbloqueado) aviso("login",""); },30000); }
  else aviso("login",`${que}. Te quedan ${5-S.intentos} ${5-S.intentos===1?"intento":"intentos"}.`,true);
}
const textoPaso=(tipo,rep)=>tipo==="pin"?(rep?"Repite el PIN para confirmarlo.":"Elige 4 cifras que recuerdes."):(rep?"Repite el patrón para confirmarlo.":"Une al menos 4 puntos sin levantar el dedo.");
function dlgBloqueo(tipo){
  S.cfg={tipo,primero:null}; pinBuf="";
  abrir(`<form data-f="nada"><h2>${tipo==="pin"?"Crea tu PIN":"Crea tu patrón"}</h2><p class="tenue" id="cfg-paso">${textoPaso(tipo,false)}</p>
    <div class="oscuro">${tipo==="pin"?puntosHTML()+tecladoHTML():patronHTML("config")}<p class="login-msg" id="cfg-msg" role="status"></p></div>
    <div class="pie"><button type="button" class="btn btn-outline-secondary" data-a="cerrar">Cancelar</button></div></form>`);
}
async function configurar(cod){
  const c=S.cfg; if(!c) return;
  pinBuf=""; pintarPuntos();
  if(!c.primero){ c.primero=cod; dlg.querySelector("#cfg-paso").textContent=textoPaso(c.tipo,true); aviso("config",""); return; }
  if(c.primero!==cod){ c.primero=null; dlg.querySelector("#cfg-paso").textContent=textoPaso(c.tipo,false); aviso("config","No coinciden. Empieza otra vez.",true); agitar("config"); return; }
  const sal=salNueva(), bloqueo={tipo:c.tipo,sal,hash:await hashCodigo(sal,cod),creado:new Date().toISOString()}, antes=S.bloqueo;
  S.bloqueo=bloqueo;
  try{ await guardarAjustes(); S.cfg=null; dlg.close(); render();
    tostada(c.tipo==="pin"?"PIN guardado. Te lo pediremos al entrar.":"Patrón guardado. Te lo pediremos al entrar."); }
  catch(e){ S.bloqueo=antes; c.primero=null; aviso("config","No se pudo guardar: "+msgError(e),true); }
}
const guardarAjustes=()=>refAjustes().set({cuenta:S.cuenta||null,bloqueo:S.bloqueo||null});
const ITER=210000;
async function derivarClave(clave,sal,iter){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveBits"]);
  const b=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:new TextEncoder().encode(sal),iterations:iter||ITER},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function cuentaNueva(email,clave){ const sal=salNueva(); return {email,sal,iter:ITER,hash:await derivarClave(clave,sal,ITER),creado:new Date().toISOString()}; }
const correoValido=c=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c);
function revisarClaves(v){
  if((v.clave||"").length<8) return "La contraseña debe tener al menos 8 caracteres.";
  if(v.clave!==v.clave2) return "Las dos contraseñas no coinciden.";
  return "";
}
function entrarConClave(){
  const tras=S.tras; S.tras=null; S.modoLogin=null; desbloquear();
  if(tras==="nuevo-bloqueo"){ S.vista="cuenta"; render(); dlgBloqueo(S.bloqueo?S.bloqueo.tipo:"pin"); }
}
/* ---------- Perfil ---------- */
function dlgPerfil(){
  const pf=perfilDe(uid()); S.fotoNueva=undefined;
  abrir(`<form data-f="perfil" novalidate><h2>Editar perfil</h2>
    <div class="foto-edit"><span id="pf-vista">${avatarHTML(uid(),80)}</span>
      <div class="pie" style="justify-content:flex-start"><label class="btn btn-sm btn-primary" for="pf-archivo" style="margin:0">Cambiar foto</label>
        <input id="pf-archivo" type="file" accept="image/*" hidden>
        ${fotoDe(uid())?`<button type="button" class="btn btn-sm btn-link" data-a="quitar-foto">Quitar foto</button>`:""}</div></div>
    <div class="campos">
      <label class="ancho" for="pf-nombre">Nombre que verán los demás<input class="form-control" id="pf-nombre" name="nombre" maxlength="60" value="${esc(miNombre())}"></label>
      <label for="pf-tel">Teléfono<input class="form-control" id="pf-tel" name="telefono" type="tel" maxlength="25" placeholder="+34 600 000 000" value="${esc(pf.telefono||"")}"></label>
      <label for="pf-ciudad">Ciudad<input class="form-control" id="pf-ciudad" name="ciudad" maxlength="60" value="${esc(pf.ciudad||"")}"></label>
      <label class="ancho" for="pf-correo">Correo de contacto<input class="form-control" id="pf-correo" name="correoContacto" type="email" maxlength="120" placeholder="nombre@correo.com" value="${esc(pf.correoContacto||(S.cuenta?S.cuenta.email:""))}"></label>
      <label class="ancho" for="pf-bio">Sobre mí<textarea class="form-control" id="pf-bio" name="bio" rows="3" maxlength="200" placeholder="Organizo sanes en familia desde 2019.">${esc(pf.bio||"")}</textarea></label></div>
    ${pieDlg("Guardar perfil")}</form>`);
}
async function fotoDesdeArchivo(file){
  if(!file||!/^image\//.test(file.type)) throw new Error("Elige una imagen, por ejemplo una foto JPG o PNG.");
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("No se pudo leer esa imagen. Prueba con otra.")); i.src=url; });
    const t=256, c=document.createElement("canvas"); c.width=c.height=t;
    const lado=Math.min(img.naturalWidth,img.naturalHeight);
    c.getContext("2d").drawImage(img,(img.naturalWidth-lado)/2,(img.naturalHeight-lado)/2,lado,lado,0,0,t,t);
    return c.toDataURL("image/jpeg",0.82);
  } finally { URL.revokeObjectURL(url); }
}
document.addEventListener("change",async e=>{
  if(e.target.id!=="pf-archivo") return;
  const er=dlg.querySelector(".error");
  try{ S.fotoNueva=await fotoDesdeArchivo(e.target.files[0]);
    $("#pf-vista").innerHTML=`<img class="avatar" src="${S.fotoNueva}" alt="" style="width:80px;height:80px">`; if(er) er.hidden=true; }
  catch(x){ if(er){ er.textContent=x.message; er.hidden=false; } }
  e.target.value="";
});
function dlgCambiarClave(){
  abrir(`<form data-f="cambiar-clave" novalidate><h2>Cambiar contraseña</h2><p class="tenue">Correo de acceso: ${esc(S.cuenta.email)}</p><div class="campos">
    <label class="ancho" for="cc-actual">Contraseña actual<input class="form-control" id="cc-actual" name="actual" type="password" autocomplete="current-password"></label>
    <label class="ancho" for="cc-clave">Contraseña nueva (mínimo 8 caracteres)<input class="form-control" id="cc-clave" name="clave" type="password" autocomplete="new-password"></label>
    <label class="ancho" for="cc-clave2">Repite la contraseña nueva<input class="form-control" id="cc-clave2" name="clave2" type="password" autocomplete="new-password"></label></div>
    ${pieDlg("Guardar contraseña")}</form>`);
}
let trazo=null;
function puntosTrazo(t,e){ const r=t.p.getBoundingClientRect();
  const pts=t.seq.map(i=>{ const b=t.p.querySelector(`.nodo[data-i="${i}"]`).getBoundingClientRect(); return [b.left+b.width/2-r.left,b.top+b.height/2-r.top]; });
  if(e) pts.push([e.clientX-r.left,e.clientY-r.top]);
  t.p.querySelector("svg").innerHTML=pts.length>1?`<polyline points="${pts.map(q=>q.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--oro-vivo)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`:""; }
function sumarNodo(n){ const i=+n.dataset.i; if(trazo.seq.includes(i)) return; trazo.seq.push(i); n.classList.add("on"); }
function limpiarPatron(p){ if(!p||!p.isConnected) return; p.querySelectorAll(".nodo.on").forEach(n=>n.classList.remove("on")); p.querySelector("svg").innerHTML=""; }
document.addEventListener("pointerdown",e=>{
  const n=e.target.closest&&e.target.closest(".patron .nodo"); if(!n) return;
  if(n.closest(".patron").dataset.ctx==="login"&&Date.now()<S.esperaHasta) return;
  e.preventDefault(); trazo={p:n.closest(".patron"),seq:[]}; S.dibujando=true; sumarNodo(n); puntosTrazo(trazo,e);
});
document.addEventListener("pointermove",e=>{
  if(!trazo) return; e.preventDefault();
  const el=document.elementFromPoint(e.clientX,e.clientY), n=el&&el.closest&&el.closest(".nodo");
  if(n&&trazo.p.contains(n)) sumarNodo(n);
  puntosTrazo(trazo,e);
},{passive:false});
function soltar(){
  if(!trazo) return; const t=trazo; trazo=null; S.dibujando=false; puntosTrazo(t);
  const ctx=t.p.dataset.ctx;
  setTimeout(()=>limpiarPatron(t.p),350);
  if(t.seq.length<4){ aviso(ctx,"Une al menos 4 puntos.",true); }
  else recibirCodigo(ctx,t.seq.join("-"));
  if(renderPendiente){ renderPendiente=false; setTimeout(render,400); }
}
document.addEventListener("pointerup",soltar);
document.addEventListener("pointercancel",soltar);
document.addEventListener("keydown",e=>{
  const pinVisible=enConfig()?!!dlg.querySelector(".teclado"):(!S.desbloqueado&&S.listo&&S.bloqueoListo&&modoLogin()==="pin"&&S.bloqueo.tipo==="pin");
  if(!pinVisible) return;
  if(/^[0-9]$/.test(e.key)){ e.preventDefault(); pulsarTecla(e.key); }
  else if(e.key==="Backspace"){ e.preventDefault(); pulsarTecla("borrar"); }
});

iniciar();

<script>
/* Sanes para Android: botón «atrás» y color de las barras del sistema. */
window.atras=function(){                    // lo llama el botón «atrás» del móvil
  try{
    if(dlg.open){ dlg.close(); return true; }
    if(!S.desbloqueado) return false;
    if(S.chatSan){ cerrarChat(); render(); return true; }

    if(S.comSan){ S.comSan=null; render(); return true; }
    if(S.vista!=="inicio"){ S.vista="inicio"; history.replaceState(null,"","#inicio"); render(); window.scrollTo(0,0); return true; }
  }catch(e){}
  return false;
};
(function(){                                // barras oscuras en la portada, claras dentro
  let ultimo=null;
  const pintar=()=>{ if(!window.SanesAndroid) return;
    const oscuro=!!document.querySelector("#app .login");
    if(oscuro===ultimo) return; ultimo=oscuro;
    try{ window.SanesAndroid.barras(oscuro?"#0E2140":"#F2F4F8", !oscuro); }catch(e){} };
  new MutationObserver(pintar).observe(document.getElementById("app"),{childList:true,subtree:false});
  pintar();
})();
</script>
